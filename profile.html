<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Profile — RdotA</title>
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="RdotA.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #000000;
      --card: rgba(28, 28, 30, 0.82);
      --card-solid: #1c1c1e;
      --separator: rgba(84, 84, 88, 0.34);
      --text-primary: #ffffff;
      --text-secondary: rgba(235, 235, 245, 0.6);
      --text-tertiary: rgba(235, 235, 245, 0.3);
      --accent: #6c5ce7;
      --accent-light: #a78bfa;
      --blue: #0a84ff;
      --red: #ff453a;
      --green: #30d158;
      --orange: #ff9f0a;
      --card-radius: 16px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body { height: 100%; overflow: hidden; background: var(--bg); }

    body {
      font-family: -apple-system, 'Inter', BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    /* iOS-style nav bar */
    .nav-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      padding-top: calc(var(--safe-top) + 12px);
      background: rgba(0, 0, 0, 0.72);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 0.5px solid var(--separator);
    }

    .nav-back {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--accent-light);
      text-decoration: none;
      font-size: 17px;
      font-weight: 400;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-back svg { flex-shrink: 0; }

    .nav-title {
      font-size: 17px;
      font-weight: 600;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .nav-spacer { width: 60px; }

    /* Scroll container */
    .scroll-content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 20px;
      padding-bottom: calc(var(--safe-bottom) + 40px);
      max-width: 500px;
      margin: 0 auto;
      width: 100%;
    }

    /* Avatar section */
    .avatar-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 0 24px;
    }

    .avatar-wrap {
      position: relative;
      width: 100px;
      height: 100px;
      margin-bottom: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 600;
      color: #fff;
      text-transform: uppercase;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(108, 92, 231, 0.3);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-edit {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--accent);
      border: 3px solid var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-status {
      font-size: 13px;
      color: var(--green);
      min-height: 18px;
      margin-bottom: 4px;
    }

    .avatar-section h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .avatar-section p {
      font-size: 13px;
      color: var(--text-tertiary);
      margin-top: 2px;
    }

    /* iOS grouped section header */
    .section-header {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: -0.08px;
      padding: 24px 20px 8px;
    }

    /* iOS inset grouped card */
    .ios-card {
      background: var(--card);
      -webkit-backdrop-filter: saturate(120%) blur(40px);
      backdrop-filter: saturate(120%) blur(40px);
      border-radius: var(--card-radius);
      overflow: hidden;
      margin-bottom: 8px;
    }

    /* iOS list row */
    .ios-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      min-height: 44px;
      position: relative;
    }

    .ios-row + .ios-row::before {
      content: '';
      position: absolute;
      top: 0;
      left: 20px;
      right: 0;
      height: 0.5px;
      background: var(--separator);
    }

    .ios-row-label {
      font-size: 16px;
      color: var(--text-primary);
      font-weight: 400;
    }

    .ios-row-value {
      font-size: 16px;
      color: var(--text-secondary);
      text-align: right;
      max-width: 55%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Tier badge */
    .tier-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .tier-free {
      background: rgba(142, 142, 147, 0.2);
      color: rgba(235, 235, 245, 0.6);
    }

    .tier-premium {
      background: rgba(108, 92, 231, 0.2);
      color: var(--accent-light);
    }

    /* Buttons inside cards */
    .ios-btn-row {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      min-height: 44px;
      position: relative;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
      border: none;
      background: none;
      width: 100%;
      font-family: inherit;
    }

    .ios-btn-row:active {
      background: rgba(120, 120, 128, 0.16);
    }

    .ios-btn-row + .ios-btn-row::before,
    .ios-row + .ios-btn-row::before {
      content: '';
      position: absolute;
      top: 0;
      left: 20px;
      right: 0;
      height: 0.5px;
      background: var(--separator);
    }

    .ios-btn-text {
      font-size: 16px;
      font-weight: 400;
    }

    .ios-btn-text.accent { color: var(--accent-light); }
    .ios-btn-text.destructive { color: var(--red); }

    /* Footer */
    .app-footer {
      text-align: center;
      padding: 32px 0 16px;
      font-size: 13px;
      color: var(--text-tertiary);
    }

    /* Crop overlay — keep dark native feel */
    .crop-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.92);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
    }

    .crop-overlay.visible { display: flex; }

    .crop-title {
      color: var(--text-primary);
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .crop-area {
      position: relative;
      width: 280px;
      height: 280px;
      border-radius: 20px;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }

    .crop-area img {
      position: absolute;
      transform-origin: 0 0;
      max-width: none;
      max-height: none;
    }

    .crop-circle {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }

    .crop-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
      width: 280px;
    }

    .crop-controls label {
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .crop-controls input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      height: 4px;
    }

    .crop-buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .crop-btn {
      padding: 12px 32px;
      border-radius: 14px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: transform 0.1s, opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .crop-btn:active { transform: scale(0.97); opacity: 0.8; }

    .crop-btn-cancel {
      background: rgba(120, 120, 128, 0.24);
      color: var(--text-primary);
    }

    .crop-btn-save {
      background: var(--accent);
      color: #fff;
    }

    /* Media queries */
    @media (max-width: 390px) {
      .scroll-content { padding: 0 16px; padding-bottom: calc(var(--safe-bottom) + 32px); }
      .avatar { width: 88px; height: 88px; font-size: 32px; }
      .avatar-wrap { width: 88px; height: 88px; }
    }

    @media (max-height: 600px) {
      .avatar-section { padding: 20px 0 16px; }
      .avatar { width: 76px; height: 76px; font-size: 28px; }
      .avatar-wrap { width: 76px; height: 76px; }
      .crop-area { width: 220px; height: 220px; }
      .crop-controls { width: 220px; }
    }
  </style>
</head>

<body>
  <!-- iOS Nav Bar -->
  <div class="nav-bar">
    <a href="index.html" class="nav-back" id="backLink">
      <svg width="13" height="21" viewBox="0 0 13 21" fill="none">
        <path d="M11 1.5L1.5 10.5L11 19.5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back
    </a>
    <span class="nav-title">Profile</span>
    <span class="nav-spacer"></span>
  </div>

  <div class="scroll-content">
    <!-- Avatar + Name -->
    <div class="avatar-section">
      <div class="avatar-wrap" id="avatarWrap" title="Change profile picture">
        <div class="avatar" id="avatar"></div>
        <div class="avatar-edit">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
          </svg>
        </div>
      </div>
      <div class="avatar-status" id="avatarStatus"></div>
      <h1 id="displayEmail">Loading...</h1>
      <p id="memberSince"></p>
      <input type="file" id="avatarInput" accept="image/*" style="display:none;">
    </div>

    <!-- Account section -->
    <div class="section-header">Account</div>
    <div class="ios-card">
      <div class="ios-row">
        <span class="ios-row-label">Email</span>
        <span class="ios-row-value" id="emailValue">&mdash;</span>
      </div>
      <div class="ios-row">
        <span class="ios-row-label">Member since</span>
        <span class="ios-row-value" id="joinDate">&mdash;</span>
      </div>
      <div class="ios-row">
        <span class="ios-row-label">Provider</span>
        <span class="ios-row-value" id="providerValue">&mdash;</span>
      </div>
    </div>

    <!-- Subscription section -->
    <div class="section-header">Subscription</div>
    <div class="ios-card">
      <div class="ios-row">
        <span class="ios-row-label">Plan</span>
        <span class="ios-row-value"><span class="tier-badge tier-free" id="tierBadge">Free</span></span>
      </div>
      <div class="ios-row" id="upgradeRow">
        <span class="ios-row-label" style="font-size:14px; color:var(--text-secondary);">Unlock faster results & more features</span>
      </div>
      <button class="ios-btn-row" id="upgradeBtn">
        <span class="ios-btn-text accent">Upgrade to Premium</span>
      </button>
    </div>

    <!-- Sign Out -->
    <div class="ios-card" style="margin-top: 24px;">
      <button class="ios-btn-row" id="signoutBtn">
        <span class="ios-btn-text destructive">Sign Out</span>
      </button>
    </div>

    <div class="app-footer">RdotA v1.0</div>
  </div>

  <!-- Crop Overlay -->
  <div class="crop-overlay" id="cropOverlay">
    <div class="crop-title">Crop Profile Picture</div>
    <div class="crop-area" id="cropArea">
      <img id="cropImg" src="">
      <div class="crop-circle"></div>
    </div>
    <div class="crop-controls">
      <label>Zoom</label>
      <input type="range" id="cropZoom" min="100" max="400" value="100">
    </div>
    <div class="crop-buttons">
      <button class="crop-btn crop-btn-cancel" id="cropCancel">Cancel</button>
      <button class="crop-btn crop-btn-save" id="cropSave">Save</button>
    </div>
  </div>

  <script>
    (function() {
      var sb = null;
      var currentUser = null;
      var cropState = { img: null, scale: 1, offsetX: 0, offsetY: 0, dragging: false, lastX: 0, lastY: 0 };

      try {
        sb = window.supabase.createClient(
          'https://dvzwupfryffqptjyxlmn.supabase.co',
          'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2end1cGZyeWZmcXB0anl4bG1uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NjIwMTksImV4cCI6MjA5NjMzODAxOX0.lAIScl3PIpfQEAYd7Im22mjAMQxNHF1663Z5moYO9sY'
        );
      } catch(e) { console.error('Supabase init failed:', e); }

      if (!sb) return;

      function setAvatar(dataUrl) {
        var el = document.getElementById('avatar');
        el.innerHTML = '<img src="' + dataUrl + '" alt="avatar">';
      }

      function setInitialAvatar(email) {
        document.getElementById('avatar').textContent = email.charAt(0).toUpperCase();
      }

      sb.auth.getSession().then(function(res) {
        if (!res.data || !res.data.session) { window.location.href = 'login.html'; return; }

        currentUser = res.data.session.user;
        var email = currentUser.email || '—';
        var created = new Date(currentUser.created_at);
        var provider = (currentUser.app_metadata && currentUser.app_metadata.provider) || 'email';
        var tier = (currentUser.user_metadata && currentUser.user_metadata.tier) || 'free';
        var avatarUrl = (currentUser.user_metadata && currentUser.user_metadata.avatar_url) || '';

        avatarUrl ? setAvatar(avatarUrl) : setInitialAvatar(email);
        localStorage.setItem('rdota_initial', email.charAt(0).toUpperCase());
        if (avatarUrl) localStorage.setItem('rdota_avatar', avatarUrl);
        else localStorage.removeItem('rdota_avatar');

        document.getElementById('displayEmail').textContent = email;
        document.getElementById('memberSince').textContent = 'Member since ' + created.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
        document.getElementById('emailValue').textContent = email;
        document.getElementById('joinDate').textContent = created.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        document.getElementById('providerValue').textContent = provider.charAt(0).toUpperCase() + provider.slice(1);

        if (tier === 'premium') {
          var badge = document.getElementById('tierBadge');
          badge.textContent = 'Premium'; badge.classList.remove('tier-free'); badge.classList.add('tier-premium');
          document.getElementById('upgradeBtn').style.display = 'none';
          document.getElementById('upgradeRow').style.display = 'none';
        }
      });

      document.getElementById('avatarWrap').addEventListener('click', function() {
        document.getElementById('avatarInput').click();
      });

      document.getElementById('avatarInput').addEventListener('change', function(e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(ev) {
          openCrop(ev.target.result);
        };
        reader.readAsDataURL(file);
        e.target.value = '';
      });

      function openCrop(dataUrl) {
        var overlay = document.getElementById('cropOverlay');
        var img = document.getElementById('cropImg');
        var zoom = document.getElementById('cropZoom');

        img.onload = function() {
          var area = document.getElementById('cropArea');
          var areaW = area.offsetWidth;
          var areaH = area.offsetHeight;
          var imgW = img.naturalWidth;
          var imgH = img.naturalHeight;
          var fitScale = Math.max(areaW / imgW, areaH / imgH);

          cropState.baseScale = fitScale;
          cropState.scale = 1;
          cropState.offsetX = (areaW - imgW * fitScale) / 2;
          cropState.offsetY = (areaH - imgH * fitScale) / 2;
          cropState.imgW = imgW;
          cropState.imgH = imgH;
          cropState.areaW = areaW;
          cropState.areaH = areaH;

          zoom.value = 100;
          updateCropTransform();
        };
        img.src = dataUrl;
        overlay.classList.add('visible');
      }

      function updateCropTransform() {
        var img = document.getElementById('cropImg');
        var s = cropState.baseScale * cropState.scale;
        img.style.transform = 'translate(' + cropState.offsetX + 'px,' + cropState.offsetY + 'px) scale(' + s + ')';
      }

      document.getElementById('cropZoom').addEventListener('input', function(e) {
        var oldScale = cropState.scale;
        cropState.scale = parseInt(e.target.value) / 100;

        var centerX = cropState.areaW / 2;
        var centerY = cropState.areaH / 2;
        var ratio = cropState.scale / oldScale;
        cropState.offsetX = centerX - (centerX - cropState.offsetX) * ratio;
        cropState.offsetY = centerY - (centerY - cropState.offsetY) * ratio;

        updateCropTransform();
      });

      var cropArea = document.getElementById('cropArea');

      function getPointerPos(e) {
        var t = e.touches ? e.touches[0] : e;
        return { x: t.clientX, y: t.clientY };
      }

      cropArea.addEventListener('mousedown', startDrag);
      cropArea.addEventListener('touchstart', startDrag, { passive: false });
      window.addEventListener('mousemove', moveDrag);
      window.addEventListener('touchmove', moveDrag, { passive: false });
      window.addEventListener('mouseup', endDrag);
      window.addEventListener('touchend', endDrag);

      function startDrag(e) {
        e.preventDefault();
        var p = getPointerPos(e);
        cropState.dragging = true;
        cropState.lastX = p.x;
        cropState.lastY = p.y;
      }

      function moveDrag(e) {
        if (!cropState.dragging) return;
        e.preventDefault();
        var p = getPointerPos(e);
        cropState.offsetX += p.x - cropState.lastX;
        cropState.offsetY += p.y - cropState.lastY;
        cropState.lastX = p.x;
        cropState.lastY = p.y;
        updateCropTransform();
      }

      function endDrag() { cropState.dragging = false; }

      document.getElementById('cropCancel').addEventListener('click', function() {
        document.getElementById('cropOverlay').classList.remove('visible');
      });

      document.getElementById('cropSave').addEventListener('click', function() {
        var size = 96;
        var canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        var ctx = canvas.getContext('2d');

        ctx.beginPath();
        ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
        ctx.clip();

        var s = cropState.baseScale * cropState.scale;
        var scaleRatio = size / cropState.areaW;
        var dx = cropState.offsetX * scaleRatio;
        var dy = cropState.offsetY * scaleRatio;
        var dw = cropState.imgW * s * scaleRatio;
        var dh = cropState.imgH * s * scaleRatio;

        var srcImg = document.getElementById('cropImg');
        ctx.drawImage(srcImg, dx, dy, dw, dh);

        var dataUrl = canvas.toDataURL('image/jpeg', 0.5);

        document.getElementById('cropOverlay').classList.remove('visible');

        // Update locally first so UI is instant
        setAvatar(dataUrl);
        localStorage.setItem('rdota_avatar', dataUrl);

        var statusEl = document.getElementById('avatarStatus');
        statusEl.textContent = 'Saving...';
        statusEl.style.color = 'var(--text-secondary)';

        var settled = false;
        var fallbackTimer = setTimeout(function() {
          if (!settled) {
            settled = true;
            statusEl.textContent = 'Saved';
            statusEl.style.color = 'var(--green)';
            setTimeout(function() { statusEl.textContent = ''; }, 2000);
          }
        }, 4000);

        try {
          sb.auth.updateUser({
            data: { avatar_url: dataUrl }
          }).then(function(updateRes) {
            if (settled) return;
            settled = true;
            clearTimeout(fallbackTimer);
            if (updateRes && updateRes.error) {
              statusEl.textContent = 'Saved locally';
              statusEl.style.color = 'var(--orange)';
            } else {
              statusEl.textContent = 'Updated';
              statusEl.style.color = 'var(--green)';
            }
            setTimeout(function() { statusEl.textContent = ''; }, 2000);
          }).catch(function() {
            if (settled) return;
            settled = true;
            clearTimeout(fallbackTimer);
            statusEl.textContent = 'Saved';
            statusEl.style.color = 'var(--green)';
            setTimeout(function() { statusEl.textContent = ''; }, 2000);
          });
        } catch(e) {
          settled = true;
          clearTimeout(fallbackTimer);
          statusEl.textContent = 'Saved';
          statusEl.style.color = 'var(--green)';
          setTimeout(function() { statusEl.textContent = ''; }, 2000);
        }
      });

      document.getElementById('signoutBtn').addEventListener('click', function() {
        localStorage.removeItem('rdota_avatar');
        localStorage.removeItem('rdota_initial');
        localStorage.removeItem('disclaimer_accepted');
        localStorage.removeItem('sains_history');
        localStorage.removeItem('ean13_history');
        Object.keys(localStorage).forEach(function(key) {
          if (key.startsWith('sb-')) localStorage.removeItem(key);
        });
        sb.auth.signOut().finally(function() {
          window.location.href = 'login.html';
        });
      });

      document.getElementById('upgradeBtn').addEventListener('click', function() {
        alert('Premium coming soon — stay tuned!');
      });

      document.getElementById('backLink').addEventListener('click', function(e) {
        if (window.history.length > 1) { e.preventDefault(); history.back(); }
      });
    })();
  </script>
</body>
</html>

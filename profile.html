<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — Barcode Tools</title>
  <meta name="theme-color" content="#0a0a0f">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #0a0a0f;
      --bg-card:    #12121a;
      --bg-input:   #1a1a26;
      --border:     #2a2a3a;
      --border-focus: #6c5ce7;
      --text-primary:   #e8e8f0;
      --text-secondary: #8888a0;
      --text-muted:     #55556a;
      --accent:      #6c5ce7;
      --accent-hover:#7d6ff0;
      --accent-glow: rgba(108, 92, 231, 0.25);
      --success: #00cec9;
      --danger:  #ff6b6b;
      --radius:  12px;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    body::before {
      content: '';
      position: fixed; top: -40%; left: -20%; width: 60%; height: 80%;
      background: radial-gradient(circle, rgba(108,92,231,0.06) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    .profile-container {
      position: relative; z-index: 1;
      width: 100%; max-width: 460px;
    }

    .back-link {
      display: inline-block;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 20px;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--text-primary); }

    .profile-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .avatar {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      font-size: 28px; font-weight: 700; color: #fff;
      text-transform: uppercase;
    }

    .profile-header h1 {
      font-size: 22px; font-weight: 700; letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .profile-header p {
      font-size: 13px; color: var(--text-muted);
    }

    .profile-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
    }

    .profile-card h2 {
      font-size: 13px; font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 16px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .info-row:last-child { border-bottom: none; }

    .info-label {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .info-value {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      text-align: right;
    }

    .tier-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tier-free {
      background: rgba(136, 136, 160, 0.15);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .tier-premium {
      background: rgba(108, 92, 231, 0.15);
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .upgrade-btn {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: var(--radius);
      background: var(--accent);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 4px;
    }
    .upgrade-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .signout-btn {
      width: 100%;
      padding: 13px 20px;
      border: 1px solid var(--danger);
      border-radius: var(--radius);
      background: rgba(255,107,107,0.08);
      color: var(--danger);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .signout-btn:hover {
      background: rgba(255,107,107,0.18);
    }

    .profile-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-muted);
    }

    @media (max-width: 480px) {
      .profile-container { max-width: 100%; }
      .profile-card { padding: 18px; }
    }
  </style>
</head>

<body>
  <div class="profile-container">
    <a href="javascript:history.back()" class="back-link">← Back</a>

    <div class="profile-header">
      <div class="avatar" id="avatar"></div>
      <h1 id="displayEmail">Loading...</h1>
      <p id="memberSince"></p>
    </div>

    <div class="profile-card">
      <h2>Account</h2>
      <div class="info-row">
        <span class="info-label">Email</span>
        <span class="info-value" id="emailValue">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">Member since</span>
        <span class="info-value" id="joinDate">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">Auth provider</span>
        <span class="info-value" id="providerValue">—</span>
      </div>
    </div>

    <div class="profile-card">
      <h2>Subscription</h2>
      <div class="info-row">
        <span class="info-label">Current plan</span>
        <span class="info-value"><span class="tier-badge tier-free" id="tierBadge">Free</span></span>
      </div>
      <div class="info-row">
        <span class="info-label">Searches</span>
        <span class="info-value" id="searchLimit">Unlimited</span>
      </div>
      <div class="info-row" id="upgradeRow">
        <span class="info-label">Upgrade for faster results & priority support</span>
      </div>
      <button class="upgrade-btn" id="upgradeBtn">Upgrade to Premium</button>
    </div>

    <button class="signout-btn" id="signoutBtn">Sign Out</button>

    <div class="profile-footer">
      Powered by RdotA
    </div>
  </div>

  <script>
    (function() {
      var sb = null;

      try {
        sb = window.supabase.createClient(
          'https://dvzwupfryffqptjyxlmn.supabase.co',
          'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2end1cGZyeWZmcXB0anl4bG1uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NjIwMTksImV4cCI6MjA5NjMzODAxOX0.lAIScl3PIpfQEAYd7Im22mjAMQxNHF1663Z5moYO9sY'
        );
      } catch(e) {
        console.error('Supabase init failed:', e);
      }

      if (!sb) return;

      sb.auth.getSession().then(function(res) {
        if (!res.data || !res.data.session) {
          window.location.href = 'login.html';
          return;
        }

        var user = res.data.session.user;
        var email = user.email || '—';
        var created = new Date(user.created_at);
        var provider = (user.app_metadata && user.app_metadata.provider) || 'email';
        var tier = (user.user_metadata && user.user_metadata.tier) || 'free';

        var initial = email.charAt(0).toUpperCase();
        document.getElementById('avatar').textContent = initial;
        document.getElementById('displayEmail').textContent = email;
        document.getElementById('memberSince').textContent = 'Member since ' + created.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
        document.getElementById('emailValue').textContent = email;
        document.getElementById('joinDate').textContent = created.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        document.getElementById('providerValue').textContent = provider.charAt(0).toUpperCase() + provider.slice(1);

        if (tier === 'premium') {
          var badge = document.getElementById('tierBadge');
          badge.textContent = 'Premium';
          badge.classList.remove('tier-free');
          badge.classList.add('tier-premium');
          document.getElementById('upgradeBtn').style.display = 'none';
          document.getElementById('upgradeRow').style.display = 'none';
        }
      });

      document.getElementById('signoutBtn').addEventListener('click', function() {
        sb.auth.signOut().then(function() {
          window.location.href = 'login.html';
        });
      });

      document.getElementById('upgradeBtn').addEventListener('click', function() {
        alert('Premium coming soon — stay tuned!');
      });
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Profile — Barcode Tools</title>
  <meta name="theme-color" content="#0a0a0f">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #0a0a0f;
      --bg-card:    #12121a;
      --bg-input:   #1a1a26;
      --border:     #2a2a3a;
      --text-primary:   #e8e8f0;
      --text-secondary: #8888a0;
      --text-muted:     #55556a;
      --accent:      #6c5ce7;
      --accent-hover:#7d6ff0;
      --accent-glow: rgba(108, 92, 231, 0.25);
      --success: #00cec9;
      --danger:  #ff6b6b;
      --radius:  10px;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }

    body::before {
      content: '';
      position: fixed; top: -40%; left: -20%; width: 60%; height: 80%;
      background: radial-gradient(circle, rgba(108,92,231,0.06) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    .profile-container {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      display: flex;
      flex-direction: column;
      max-height: 100vh;
      max-height: 100dvh;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .back-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--text-primary); }

    .profile-header {
      text-align: center;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .avatar-wrap {
      position: relative;
      width: 64px; height: 64px;
      margin: 0 auto 8px;
      cursor: pointer;
    }

    .avatar {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 700; color: #fff;
      text-transform: uppercase;
      overflow: hidden;
      border: 2px solid var(--border);
      transition: border-color 0.2s;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-wrap:hover .avatar { border-color: var(--accent); }

    .avatar-edit {
      position: absolute;
      bottom: -2px; right: -2px;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg-primary);
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }

    .avatar-status {
      text-align: center;
      font-size: 11px;
      color: var(--success);
      min-height: 14px;
    }

    .profile-header h1 {
      font-size: 18px; font-weight: 700; letter-spacing: -0.3px;
      margin-bottom: 2px;
    }

    .profile-header p {
      font-size: 12px; color: var(--text-muted);
    }

    .profile-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .profile-card h2 {
      font-size: 11px; font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .info-row:last-child { border-bottom: none; }

    .info-label {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .info-value {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      text-align: right;
    }

    .tier-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .tier-free {
      background: rgba(136, 136, 160, 0.15);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .tier-premium {
      background: rgba(108, 92, 231, 0.15);
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .upgrade-btn {
      width: 100%;
      padding: 11px 16px;
      border: none;
      border-radius: var(--radius);
      background: var(--accent);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 4px;
    }
    .upgrade-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .signout-btn {
      width: 100%;
      padding: 11px 16px;
      border: 1px solid var(--danger);
      border-radius: var(--radius);
      background: rgba(255,107,107,0.08);
      color: var(--danger);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      flex-shrink: 0;
    }
    .signout-btn:hover { background: rgba(255,107,107,0.18); }

    .profile-footer {
      text-align: center;
      margin-top: 10px;
      font-size: 11px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    @media (max-height: 700px) {
      .profile-header { margin-bottom: 8px; }
      .avatar-wrap { width: 52px; height: 52px; margin-bottom: 6px; }
      .avatar { width: 52px; height: 52px; font-size: 20px; }
      .profile-header h1 { font-size: 16px; }
      .profile-card { padding: 10px 14px; margin-bottom: 8px; }
      .profile-card h2 { margin-bottom: 4px; font-size: 10px; }
      .info-row { padding: 6px 0; }
      .info-label, .info-value { font-size: 12px; }
      .upgrade-btn, .signout-btn { padding: 9px 14px; font-size: 12px; }
      .top-bar { margin-bottom: 8px; }
    }

    @media (max-height: 600px) {
      body { padding: 10px; }
      .avatar-wrap { width: 44px; height: 44px; }
      .avatar { width: 44px; height: 44px; font-size: 18px; }
      .profile-card { padding: 8px 12px; margin-bottom: 6px; border-radius: 10px; }
      .info-row { padding: 4px 0; }
    }
  </style>
</head>

<body>
  <div class="profile-container">
    <div class="top-bar">
      <a href="generators.html" class="back-link" id="backLink">← Back</a>
      <span style="font-size:11px; color:var(--text-muted);">Account</span>
    </div>

    <div class="profile-header">
      <div class="avatar-wrap" id="avatarWrap" title="Change profile picture">
        <div class="avatar" id="avatar"></div>
        <div class="avatar-edit">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
        </div>
      </div>
      <div class="avatar-status" id="avatarStatus"></div>
      <h1 id="displayEmail">Loading...</h1>
      <p id="memberSince"></p>
      <input type="file" id="avatarInput" accept="image/*" style="display:none;">
    </div>

    <div class="profile-card">
      <h2>Account</h2>
      <div class="info-row">
        <span class="info-label">Email</span>
        <span class="info-value" id="emailValue">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">Member since</span>
        <span class="info-value" id="joinDate">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">Provider</span>
        <span class="info-value" id="providerValue">—</span>
      </div>
    </div>

    <div class="profile-card">
      <h2>Subscription</h2>
      <div class="info-row">
        <span class="info-label">Plan</span>
        <span class="info-value"><span class="tier-badge tier-free" id="tierBadge">Free</span></span>
      </div>
      <div class="info-row" id="upgradeRow" style="border-bottom:none;">
        <span class="info-label" style="font-size:12px;">Upgrade for faster results</span>
      </div>
      <button class="upgrade-btn" id="upgradeBtn">Upgrade to Premium</button>
    </div>

    <button class="signout-btn" id="signoutBtn">Sign Out</button>

    <div class="profile-footer">
      Powered by RdotA
    </div>
  </div>

  <script>
    (function() {
      var sb = null;
      var currentUser = null;

      try {
        sb = window.supabase.createClient(
          'https://dvzwupfryffqptjyxlmn.supabase.co',
          'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2end1cGZyeWZmcXB0anl4bG1uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NjIwMTksImV4cCI6MjA5NjMzODAxOX0.lAIScl3PIpfQEAYd7Im22mjAMQxNHF1663Z5moYO9sY'
        );
      } catch(e) {
        console.error('Supabase init failed:', e);
      }

      if (!sb) return;

      function setAvatar(url) {
        var el = document.getElementById('avatar');
        if (url) {
          el.innerHTML = '<img src="' + url + '" alt="avatar">';
        }
      }

      function setInitialAvatar(email) {
        var el = document.getElementById('avatar');
        el.textContent = email.charAt(0).toUpperCase();
      }

      sb.auth.getSession().then(function(res) {
        if (!res.data || !res.data.session) {
          window.location.href = 'login.html';
          return;
        }

        currentUser = res.data.session.user;
        var email = currentUser.email || '—';
        var created = new Date(currentUser.created_at);
        var provider = (currentUser.app_metadata && currentUser.app_metadata.provider) || 'email';
        var tier = (currentUser.user_metadata && currentUser.user_metadata.tier) || 'free';
        var avatarUrl = (currentUser.user_metadata && currentUser.user_metadata.avatar_url) || '';

        if (avatarUrl) {
          setAvatar(avatarUrl);
        } else {
          setInitialAvatar(email);
        }

        document.getElementById('displayEmail').textContent = email;
        document.getElementById('memberSince').textContent = 'Member since ' + created.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
        document.getElementById('emailValue').textContent = email;
        document.getElementById('joinDate').textContent = created.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        document.getElementById('providerValue').textContent = provider.charAt(0).toUpperCase() + provider.slice(1);

        if (tier === 'premium') {
          var badge = document.getElementById('tierBadge');
          badge.textContent = 'Premium';
          badge.classList.remove('tier-free');
          badge.classList.add('tier-premium');
          document.getElementById('upgradeBtn').style.display = 'none';
          document.getElementById('upgradeRow').style.display = 'none';
        }
      });

      document.getElementById('avatarWrap').addEventListener('click', function() {
        document.getElementById('avatarInput').click();
      });

      document.getElementById('avatarInput').addEventListener('change', function(e) {
        var file = e.target.files[0];
        if (!file || !currentUser) return;

        var statusEl = document.getElementById('avatarStatus');
        statusEl.textContent = 'Uploading...';
        statusEl.style.color = '#8888a0';

        var ext = file.name.split('.').pop().toLowerCase();
        var path = currentUser.id + '/avatar.' + ext;

        sb.storage.from('avatars').upload(path, file, {
          cacheControl: '3600',
          upsert: true
        }).then(function(uploadRes) {
          if (uploadRes.error) {
            statusEl.textContent = 'Upload failed — ' + uploadRes.error.message;
            statusEl.style.color = '#ff6b6b';
            return;
          }

          var publicUrl = 'https://dvzwupfryffqptjyxlmn.supabase.co/storage/v1/object/public/avatars/' + path + '?t=' + Date.now();

          sb.auth.updateUser({
            data: { avatar_url: publicUrl }
          }).then(function(updateRes) {
            if (updateRes.error) {
              statusEl.textContent = 'Saved but failed to update profile';
              statusEl.style.color = '#ff6b6b';
              return;
            }
            setAvatar(publicUrl);
            statusEl.textContent = 'Updated!';
            statusEl.style.color = '#00cec9';
            setTimeout(function() { statusEl.textContent = ''; }, 2000);
          });
        });
      });

      document.getElementById('signoutBtn').addEventListener('click', function() {
        sb.auth.signOut().then(function() {
          window.location.href = 'login.html';
        });
      });

      document.getElementById('upgradeBtn').addEventListener('click', function() {
        alert('Premium coming soon — stay tuned!');
      });

      document.getElementById('backLink').addEventListener('click', function(e) {
        if (window.history.length > 1) {
          e.preventDefault();
          history.back();
        }
      });
    })();
  </script>
</body>
</html>

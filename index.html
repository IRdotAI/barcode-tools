<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>RdotA Generators</title>
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="RdotA.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #000000;
      --card: rgba(28, 28, 30, 0.82);
      --card-solid: #1c1c1e;
      --input-bg: rgba(44, 44, 46, 0.8);
      --separator: rgba(84, 84, 88, 0.34);
      --text-primary: #ffffff;
      --text-secondary: rgba(235, 235, 245, 0.6);
      --text-tertiary: rgba(235, 235, 245, 0.3);
      --accent: #6c5ce7;
      --accent-light: #a78bfa;
      --accent-hover: #7d6ff0;
      --accent-glow: rgba(108, 92, 231, 0.25);
      --neon-purple: #A78BFA;
      --success: #00cec9;
      --danger: #ff6b6b;
      --card-radius: 16px;
    }

    body {
      font-family: -apple-system, 'Inter', BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      padding: 24px;
      padding-top: env(safe-area-inset-top, 24px);
      padding-bottom: env(safe-area-inset-bottom, 24px);
      padding-left: env(safe-area-inset-left, 24px);
      padding-right: env(safe-area-inset-right, 24px);
      overflow-x: hidden;
    }

    .layout {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      flex-shrink: 0;
    }

    .dropdown-menu {
      background: var(--card);
      backdrop-filter: saturate(120%) blur(40px);
      -webkit-backdrop-filter: saturate(120%) blur(40px);
      border-radius: var(--card-radius);
      padding: 0;
      overflow: hidden;
    }

    .dropdown-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: transparent;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid var(--separator);
      transition: all 0.2s ease;
    }

    .dropdown-header:hover {
      background: rgba(44, 44, 46, 0.5);
    }

    .dropdown-header-text {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .dropdown-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease;
      color: var(--accent);
    }

    .dropdown-icon.open {
      transform: rotate(180deg);
    }

    .dropdown-items {
      display: none;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .dropdown-items.open {
      display: block;
      max-height: 400px;
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
      border-bottom: 1px solid var(--separator);
    }

    .dropdown-item:last-child {
      border-bottom: none;
    }

    .dropdown-item:hover {
      background: rgba(44, 44, 46, 0.5);
      color: var(--accent-light);
      padding-left: 24px;
    }

    .dropdown-icon-item {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 300px;
    }

    .header {
      text-align: center;
      margin-bottom: 48px;
    }

    .header h1 {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--neon-purple);
      margin-bottom: 12px;
    }

    .header p {
      font-size: 16px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    /* Store Grid */
    .store-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 1000px;
    }

    .store-card {
      background: var(--card);
      backdrop-filter: saturate(120%) blur(40px);
      -webkit-backdrop-filter: saturate(120%) blur(40px);
      border-radius: var(--card-radius);
      padding: 32px 24px;
      text-align: center;
      transition: all 0.3s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      min-height: 300px;
    }

    .store-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 30% 50%, rgba(167, 139, 250, 0.1) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .store-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 2px 8px rgba(167, 139, 250, 0.1);
    }

    .store-card:hover::before {
      opacity: 1;
    }

    .store-card.search-bar {
      background: var(--input-bg);
      padding: 12px 16px;
      margin-bottom: 12px;
      min-height: auto;
      cursor: default;
    }

    .store-card.search-bar:hover {
      transform: none;
      box-shadow: none;
    }

    .search-input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      outline: none;
      text-align: center;
    }

    .search-input::placeholder {
      color: var(--text-tertiary);
    }

    .search-icon {
      color: var(--neon-purple);
      font-weight: 600;
      margin-right: 8px;
    }

    .store-logo {
      width: 80px;
      height: 80px;
      object-fit: cover;
      margin-bottom: 20px;
      filter: brightness(1.1);
      border-radius: 18px;
    }

    .store-logo.letter {
      width: 100px;
      height: 100px;
      font-size: 72px;
      font-weight: 800;
      color: var(--neon-purple);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .store-name {
      font-size: 22px;
      font-weight: 700;
      color: var(--neon-purple);
      margin-bottom: 8px;
    }

    .store-status {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .footer {
      text-align: center;
      margin-top: 48px;
      color: var(--text-tertiary);
      font-size: 13px;
    }

    @media (max-width: 900px) {
      .layout {
        flex-direction: column;
        gap: 24px;
      }

      .sidebar {
        width: 100%;
      }

      .header h1 {
        font-size: 36px;
      }

      .store-grid {
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 16px;
      }

      .header h1 {
        font-size: 28px;
      }

      .store-grid {
        grid-template-columns: 1fr;
      }

      .sidebar {
        width: 100%;
      }
    }
  </style>
</head>

  <script>
    function toggleDropdown() {
      const dropdownItems = document.getElementById('dropdownItems');
      const dropdownIcon = document.getElementById('dropdownIcon');

      dropdownItems.classList.toggle('open');
      dropdownIcon.classList.toggle('open');
    }

    // Close dropdown when clicking on a link
    document.querySelectorAll('.dropdown-item').forEach(item => {
      item.addEventListener('click', () => {
        document.getElementById('dropdownItems').classList.remove('open');
        document.getElementById('dropdownIcon').classList.remove('open');
      });
    });
  </script>

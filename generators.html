<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RdotA Generators</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0a0f;
      --bg-card: #12121a;
      --bg-input: #1a1a26;
      --border: #2a2a3a;
      --text-primary: #e8e8f0;
      --text-secondary: #8888a0;
      --text-muted: #55556a;
      --accent: #6c5ce7;
      --accent-hover: #7d6ff0;
      --accent-glow: rgba(108, 92, 231, 0.25);
      --neon-purple: #A78BFA;
      --success: #00cec9;
      --danger: #ff6b6b;
      --radius: 12px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      padding: 24px;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -40%;
      left: -20%;
      width: 60%;
      height: 80%;
      background: radial-gradient(circle, rgba(108, 92, 231, 0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -40%;
      right: -20%;
      width: 60%;
      height: 80%;
      background: radial-gradient(circle, rgba(0, 206, 201, 0.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .layout {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      flex-shrink: 0;
    }

    .dropdown-menu {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 0;
      overflow: hidden;
    }

    .dropdown-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--bg-card);
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid var(--border);
      transition: all 0.2s ease;
    }

    .dropdown-header:hover {
      background: #1a1a26;
    }

    .dropdown-header-text {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .dropdown-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease;
      color: var(--accent);
    }

    .dropdown-icon.open {
      transform: rotate(180deg);
    }

    .dropdown-items {
      display: none;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .dropdown-items.open {
      display: block;
      max-height: 400px;
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
      border-bottom: 1px solid var(--border);
    }

    .dropdown-item:last-child {
      border-bottom: none;
    }

    .dropdown-item:hover {
      background: #1a1a26;
      color: var(--accent);
      padding-left: 24px;
    }

    .dropdown-icon-item {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 300px;
    }

    .header {
      text-align: center;
      margin-bottom: 48px;
    }

    .header h1 {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--neon-purple);
      margin-bottom: 12px;
    }

    .header p {
      font-size: 16px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    /* Store Grid */
    .store-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 1000px;
    }

    .store-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      transition: all 0.3s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      min-height: 300px;
    }

    .store-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 30% 50%, rgba(167, 139, 250, 0.1) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .store-card:hover {
      border-color: var(--neon-purple);
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(167, 139, 250, 0.15);
    }

    .store-card:hover::before {
      opacity: 1;
    }

    .store-card.search-bar {
      background: var(--bg-input);
      border: 1px solid var(--border);
      padding: 12px 16px;
      margin-bottom: 12px;
      min-height: auto;
      cursor: default;
    }

    .store-card.search-bar:hover {
      border-color: var(--border);
      transform: none;
      box-shadow: none;
    }

    .search-input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      outline: none;
      text-align: center;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-icon {
      color: var(--neon-purple);
      font-weight: 600;
      margin-right: 8px;
    }

    .store-logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 20px;
      filter: brightness(1.1);
    }

    .store-logo.letter {
      width: 100px;
      height: 100px;
      font-size: 72px;
      font-weight: 800;
      color: var(--neon-purple);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .store-name {
      font-size: 22px;
      font-weight: 700;
      color: var(--neon-purple);
      margin-bottom: 8px;
    }

    .store-status {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .footer {
      text-align: center;
      margin-top: 48px;
      color: var(--text-muted);
      font-size: 13px;
    }

    @media (max-width: 900px) {
      .layout {
        flex-direction: column;
        gap: 24px;
      }

      .sidebar {
        width: 100%;
      }

      .header h1 {
        font-size: 36px;
      }

      .store-grid {
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 16px;
      }

      .header h1 {
        font-size: 28px;
      }

      .store-grid {
        grid-template-columns: 1fr;
      }

      .sidebar {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="layout">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="dropdown-menu">
        <div class="dropdown-header" onclick="toggleDropdown()">
          <span class="dropdown-header-text">☰ Tools</span>
          <div class="dropdown-icon" id="dropdownIcon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>

        <div class="dropdown-items" id="dropdownItems">
          <a href="index.html" class="dropdown-item">
            <div class="dropdown-icon-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2" />
                <line x1="6" y1="8" x2="6" y2="16" />
                <line x1="9" y1="8" x2="9" y2="16" />
                <line x1="12" y1="8" x2="12" y2="16" />
                <line x1="15" y1="8" x2="15" y2="16" />
                <line x1="18" y1="8" x2="18" y2="16" />
              </svg>
            </div>
            Generate
          </a>

          <a href="template.html" class="dropdown-item">
            <div class="dropdown-icon-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
              </svg>
            </div>
            Template
          </a>

          <a href="reader.html" class="dropdown-item">
            <div class="dropdown-icon-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </div>
            Reader
          </a>

          <a href="wallet.html" class="dropdown-item">
            <div class="dropdown-icon-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                <line x1="2" y1="10" x2="22" y2="10"></line>
              </svg>
            </div>
            Wallet
          </a>

          <a href="batch.html" class="dropdown-item">
            <div class="dropdown-icon-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
              </svg>
            </div>
            Batch Print
          </a>

          <a href="coupons.html" class="dropdown-item">
            <div class="dropdown-icon-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
                <line x1="7" y1="7" x2="7.01" y2="7"></line>
              </svg>
            </div>
            Coupons
          </a>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="header">
        <h1>RdotA Generators</h1>
        <p>Select a generator below</p>
      </div>

      <div class="store-grid">
        <a href="sainsbury.html" class="store-card">
          <img src="sainsbury.png" alt="Sainsbury's" class="store-logo">
          <div class="store-name">Sainsbury Generator</div>
          <div class="store-status">Available now</div>
        </a>

        <a href="#" class="store-card" onclick="event.preventDefault(); alert('ASDA Generator coming soon!');">
          <div class="store-logo letter">A</div>
          <div class="store-name">Asda Generator</div>
          <div class="store-status">Coming soon</div>
        </a>

        <a href="#" class="store-card" onclick="event.preventDefault(); alert('Waitrose Generator coming soon!');">
          <div style="font-size: 48px; margin-bottom: 16px; font-weight: 600; color: var(--orange);">W</div>
          <div class="store-name">Waitrose Generator</div>
          <div class="store-status">Coming soon</div>
        </a>
      </div>

      <div class="footer">
        <p>© 2026 RdotA</p>
      </div>
    </div>
  </div>

  <script>
    function toggleDropdown() {
      const dropdownItems = document.getElementById('dropdownItems');
      const dropdownIcon = document.getElementById('dropdownIcon');

      dropdownItems.classList.toggle('open');
      dropdownIcon.classList.toggle('open');
    }

    // Close dropdown when clicking on a link
    document.querySelectorAll('.dropdown-item').forEach(item => {
      item.addEventListener('click', () => {
        document.getElementById('dropdownItems').classList.remove('open');
        document.getElementById('dropdownIcon').classList.remove('open');
      });
    });
  </script>
</body>

</html>

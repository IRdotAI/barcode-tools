<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Barcode Tools</title>
  <meta name="theme-color" content="#0a0a0f">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(r) { r.unregister(); });
      });
      caches.keys().then(function(names) {
        names.forEach(function(n) { caches.delete(n); });
      });
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #0a0a0f;
      --bg-card:    #12121a;
      --bg-input:   #1a1a26;
      --border:     #2a2a3a;
      --border-focus: #6c5ce7;
      --text-primary:   #e8e8f0;
      --text-secondary: #8888a0;
      --text-muted:     #55556a;
      --accent:      #6c5ce7;
      --accent-hover:#7d6ff0;
      --accent-glow: rgba(108, 92, 231, 0.25);
      --success: #00cec9;
      --danger:  #ff6b6b;
      --radius:  12px;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    body.signup-active {
      overflow-y: auto;
      height: auto;
      min-height: 100%;
    }

    body::before {
      content: '';
      position: fixed; top: -40%; left: -20%; width: 60%; height: 80%;
      background: radial-gradient(circle, rgba(108,92,231,0.06) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    .auth-container {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
    }

    .auth-header {
      text-align: center; margin-bottom: 32px;
    }
    .auth-logo {
      width: 64px; height: 64px; border-radius: 16px;
      margin-bottom: 20px;
    }
    .auth-header h1 {
      font-size: 26px; font-weight: 700; letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .auth-header p {
      font-size: 14px; color: var(--text-secondary);
    }

    .auth-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 16px; padding: 28px;
    }

    .auth-tabs {
      display: flex; gap: 0; margin-bottom: 24px;
      background: var(--bg-input); border-radius: 10px; padding: 4px;
    }
    .auth-tab {
      flex: 1; padding: 10px; border: none; background: none;
      color: var(--text-muted); font-family: 'Inter', sans-serif;
      font-size: 14px; font-weight: 600; cursor: pointer;
      border-radius: 8px; transition: all 0.2s;
    }
    .auth-tab.active {
      background: var(--accent); color: #fff;
    }

    .auth-form { display: none; }
    .auth-form.active { display: block; }

    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; font-size: 12px; font-weight: 500;
      color: var(--text-secondary); margin-bottom: 8px;
      text-transform: uppercase; letter-spacing: 0.6px;
    }
    .form-group input {
      width: 100%; padding: 13px 16px;
      background: var(--bg-input); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text-primary);
      font-family: 'Inter', sans-serif; font-size: 15px;
      outline: none; transition: all 0.25s ease;
    }
    .form-group input::placeholder { color: var(--text-muted); }
    .form-group input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .auth-btn {
      width: 100%; padding: 14px 20px; border: none;
      border-radius: var(--radius); background: var(--accent);
      color: #fff; font-family: 'Inter', sans-serif;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: all 0.25s ease; margin-top: 8px;
    }
    .auth-btn:hover:not(:disabled) {
      background: var(--accent-hover); transform: translateY(-1px);
      box-shadow: 0 6px 20px var(--accent-glow);
    }
    .auth-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .auth-error {
      display: none; background: rgba(255,107,107,0.1);
      border: 1px solid var(--danger); color: #ff8888;
      padding: 12px 16px; border-radius: var(--radius);
      font-size: 13px; margin-bottom: 16px; text-align: center;
    }
    .auth-error.visible { display: block; }

    .auth-success {
      display: none; background: rgba(0,206,201,0.1);
      border: 1px solid var(--success); color: var(--success);
      padding: 12px 16px; border-radius: var(--radius);
      font-size: 13px; margin-bottom: 16px; text-align: center;
    }
    .auth-success.visible { display: block; }

    .auth-footer {
      text-align: center; margin-top: 20px;
      font-size: 12px; color: var(--text-muted);
    }

    @media (max-width: 480px) {
      .auth-container { max-width: 100%; }
      .auth-card { padding: 20px; }
    }
  </style>
</head>

<body>
  <div class="auth-container">
    <div class="auth-header">
      <img src="RdotA.png" alt="RdotA" class="auth-logo">
      <h1>Barcode Tools</h1>
      <p>Sign in to access the generator</p>
    </div>

    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin">Sign In</button>
        <button class="auth-tab" id="tabSignup">Sign Up</button>
      </div>

      <div class="auth-error" id="authError"></div>
      <div class="auth-success" id="authSuccess"></div>

      <form class="auth-form active" id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="Your password" required autocomplete="current-password">
        </div>
        <button type="submit" class="auth-btn" id="loginBtn">Sign In</button>
      </form>

      <form class="auth-form" id="signupForm">
        <div class="form-group">
          <label for="signupEmail">Email</label>
          <input type="email" id="signupEmail" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" placeholder="Min 6 characters" required minlength="6" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="signupConfirm">Confirm Password</label>
          <input type="password" id="signupConfirm" placeholder="Repeat password" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="auth-btn" id="signupBtn">Create Account</button>
      </form>
    </div>

    <div class="auth-footer">
      Powered by RdotA
    </div>
  </div>

  <script>
    (function() {
      var sb = null;
      var errEl = document.getElementById('authError');
      var successEl = document.getElementById('authSuccess');
      var tabLogin = document.getElementById('tabLogin');
      var tabSignup = document.getElementById('tabSignup');
      var loginForm = document.getElementById('loginForm');
      var signupForm = document.getElementById('signupForm');
      var loginBtn = document.getElementById('loginBtn');
      var signupBtn = document.getElementById('signupBtn');
      var tabs = [tabLogin, tabSignup];

      function showError(msg) {
        errEl.textContent = msg;
        errEl.classList.add('visible');
        successEl.classList.remove('visible');
      }

      function showSuccess(msg) {
        successEl.textContent = msg;
        successEl.classList.add('visible');
        errEl.classList.remove('visible');
      }

      function hideMessages() {
        errEl.classList.remove('visible');
        successEl.classList.remove('visible');
      }

      function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);
      }

      function friendlyError(msg) {
        var m = msg.toLowerCase();
        if (m.indexOf('invalid login credentials') !== -1 || m.indexOf('invalid_credentials') !== -1) return 'Incorrect email or password. Double-check and try again.';
        if (m.indexOf('email not confirmed') !== -1) return "Your email hasn't been confirmed yet — check your inbox.";
        if (m.indexOf('already registered') !== -1 || m.indexOf('already been registered') !== -1) return 'This email is already in use. Try signing in instead.';
        if (m.indexOf('rate limit') !== -1 || m.indexOf('too many requests') !== -1 || m.indexOf('email_send_rate') !== -1) return 'Too many attempts — wait a minute and try again.';
        if (m.indexOf('password') !== -1 && m.indexOf('at least') !== -1) return 'Password must be at least 6 characters.';
        if (m.indexOf('signup is disabled') !== -1) return 'Sign-ups are currently closed.';
        if (m.indexOf('email_address_invalid') !== -1 || m.indexOf('invalid email') !== -1) return "That email address isn't valid — check for typos.";
        return msg;
      }

      function switchTab(tab) {
        tabs.forEach(function(t) { t.classList.remove('active'); });
        loginForm.classList.remove('active');
        signupForm.classList.remove('active');
        hideMessages();

        if (tab === 'login') {
          tabLogin.classList.add('active');
          loginForm.classList.add('active');
          document.body.classList.remove('signup-active');
        } else {
          tabSignup.classList.add('active');
          signupForm.classList.add('active');
          document.body.classList.add('signup-active');
        }
      }

      tabLogin.addEventListener('click', function() { switchTab('login'); });
      tabSignup.addEventListener('click', function() { switchTab('signup'); });

      loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        hideMessages();
        if (!sb) { showError('Auth service not loaded — refresh the page'); return; }

        var email = document.getElementById('loginEmail').value.trim();
        var password = document.getElementById('loginPassword').value;

        if (!email) { showError('Please enter your email address.'); return; }
        if (!isValidEmail(email)) { showError("That doesn't look like a valid email — check for typos."); return; }
        if (!password) { showError('Please enter your password.'); return; }

        loginBtn.disabled = true;
        loginBtn.textContent = 'Signing in...';

        sb.auth.signInWithPassword({ email: email, password: password }).then(function(res) {
          if (res.error) {
            showError(friendlyError(res.error.message));
            loginBtn.disabled = false;
            loginBtn.textContent = 'Sign In';
            return;
          }
          window.location.href = 'sainsbury.html';
        }).catch(function(err) {
          showError('Connection error — check your internet and try again.');
          loginBtn.disabled = false;
          loginBtn.textContent = 'Sign In';
        });
      });

      signupForm.addEventListener('submit', function(e) {
        e.preventDefault();
        hideMessages();
        if (!sb) { showError('Auth service not loaded — refresh the page'); return; }

        var email = document.getElementById('signupEmail').value.trim();
        var password = document.getElementById('signupPassword').value;
        var confirm = document.getElementById('signupConfirm').value;

        if (!email) { showError('Please enter your email address.'); return; }
        if (!isValidEmail(email)) { showError("That doesn't look like a valid email — check for typos."); return; }
        if (!password) { showError('Please choose a password.'); return; }
        if (password.length < 6) { showError('Password must be at least 6 characters.'); return; }
        if (password !== confirm) { showError("Passwords don't match — try retyping them."); return; }

        signupBtn.disabled = true;
        signupBtn.textContent = 'Creating account...';

        sb.auth.signUp({ email: email, password: password }).then(function(res) {
          if (res.error) {
            showError(friendlyError(res.error.message));
            signupBtn.disabled = false;
            signupBtn.textContent = 'Create Account';
            return;
          }

          if (res.data && res.data.user && res.data.user.identities && res.data.user.identities.length === 0) {
            showError('This email is already in use. Try signing in instead.');
            signupBtn.disabled = false;
            signupBtn.textContent = 'Create Account';
            return;
          }

          showSuccess('Account created! Check your email to confirm, then sign in.');
          signupBtn.disabled = false;
          signupBtn.textContent = 'Create Account';
          switchTab('login');
        }).catch(function(err) {
          showError('Connection error — check your internet and try again.');
          signupBtn.disabled = false;
          signupBtn.textContent = 'Create Account';
        });
      });

      try {
        sb = window.supabase.createClient(
          'https://dvzwupfryffqptjyxlmn.supabase.co',
          'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2end1cGZyeWZmcXB0anl4bG1uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NjIwMTksImV4cCI6MjA5NjMzODAxOX0.lAIScl3PIpfQEAYd7Im22mjAMQxNHF1663Z5moYO9sY'
        );
        sb.auth.getSession().then(function(res) {
          if (res.data && res.data.session) window.location.href = 'sainsbury.html';
        });
      } catch(e) {
        console.error('Supabase init failed:', e);
      }
    })();
  </script>
</body>
</html>

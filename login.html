<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sign In — RdotA</title>
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="RdotA.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(r) { r.unregister(); });
      });
      caches.keys().then(function(names) {
        names.forEach(function(n) { caches.delete(n); });
      });
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #000000;
      --card: rgba(28, 28, 30, 0.82);
      --card-solid: #1c1c1e;
      --input-bg: rgba(44, 44, 46, 0.8);
      --separator: rgba(84, 84, 88, 0.34);
      --text-primary: #ffffff;
      --text-secondary: rgba(235, 235, 245, 0.6);
      --text-tertiary: rgba(235, 235, 245, 0.3);
      --accent: #6c5ce7;
      --accent-light: #a78bfa;
      --red: #ff453a;
      --green: #30d158;
      --card-radius: 16px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body { height: 100%; overflow: hidden; background: var(--bg); }

    body {
      font-family: -apple-system, 'Inter', BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-top: calc(var(--safe-top) + 24px);
      padding-bottom: calc(var(--safe-bottom) + 24px);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    body.signup-active {
      overflow-y: auto;
      height: auto;
      min-height: 100%;
    }

    .auth-container {
      width: 100%; max-width: 400px;
    }

    .auth-header {
      text-align: center; margin-bottom: 32px;
    }

    .auth-logo {
      width: 64px; height: 64px; border-radius: 16px;
      margin-bottom: 20px; object-fit: contain;
    }

    .auth-header h1 {
      font-size: 28px; font-weight: 700; letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .auth-header p {
      font-size: 15px; color: var(--text-secondary);
    }

    .auth-card {
      background: var(--card);
      -webkit-backdrop-filter: saturate(120%) blur(40px);
      backdrop-filter: saturate(120%) blur(40px);
      border-radius: var(--card-radius);
      padding: 24px;
      overflow: hidden;
    }

    .auth-tabs {
      display: flex; gap: 0; margin-bottom: 24px;
      background: rgba(120, 120, 128, 0.12);
      border-radius: 10px; padding: 3px;
    }

    .auth-tab {
      flex: 1; padding: 9px; border: none; background: none;
      color: var(--text-secondary);
      font-family: inherit; font-size: 14px; font-weight: 600;
      cursor: pointer; border-radius: 8px; transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .auth-tab.active {
      background: rgba(120, 120, 128, 0.24);
      color: var(--text-primary);
    }

    .auth-form { display: none; }
    .auth-form.active { display: block; }

    .form-group { margin-bottom: 14px; }

    .form-group label {
      display: block; font-size: 13px; font-weight: 500;
      color: var(--text-secondary); margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: 0.3px;
    }

    .form-group input {
      width: 100%; padding: 14px 16px;
      background: var(--input-bg);
      border: none; border-radius: 12px;
      color: var(--text-primary);
      font-family: inherit; font-size: 16px;
      outline: none; transition: all 0.2s;
    }

    .form-group input::placeholder { color: var(--text-tertiary); }
    .form-group input:focus {
      background: rgba(44, 44, 46, 1);
      box-shadow: 0 0 0 2px var(--accent);
    }

    .auth-btn {
      width: 100%; padding: 15px 20px; border: none;
      border-radius: 14px; background: var(--accent);
      color: #fff; font-family: inherit;
      font-size: 16px; font-weight: 600; cursor: pointer;
      transition: all 0.15s; margin-top: 8px;
      -webkit-tap-highlight-color: transparent;
    }

    .auth-btn:active:not(:disabled) { transform: scale(0.98); opacity: 0.9; }
    .auth-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .auth-error {
      display: none; background: rgba(255, 69, 58, 0.12);
      color: var(--red); padding: 12px 16px;
      border-radius: 12px; font-size: 14px;
      margin-bottom: 14px; text-align: center;
    }
    .auth-error.visible { display: block; }

    .auth-success {
      display: none; background: rgba(48, 209, 88, 0.12);
      color: var(--green); padding: 12px 16px;
      border-radius: 12px; font-size: 14px;
      margin-bottom: 14px; text-align: center;
    }
    .auth-success.visible { display: block; }

    .forgot-link {
      display: block; text-align: center; margin-top: 14px;
      font-size: 14px; color: var(--accent-light);
      cursor: pointer; background: none; border: none;
      font-family: inherit; width: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    .auth-footer {
      text-align: center; margin-top: 20px;
      font-size: 13px; color: var(--text-tertiary);
    }

    /* Already logged in panel */
    .already-logged-in {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 32px 20px;
      width: 100%;
    }

    .already-logged-in .ali-avatar {
      width: 80px; height: 80px; border-radius: 50%;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background: var(--accent); color: #fff;
      font-size: 30px; font-weight: 600; text-transform: uppercase;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(108, 92, 231, 0.3);
    }

    .already-logged-in h2 {
      font-size: 20px; font-weight: 600; margin-bottom: 6px;
    }

    .already-logged-in .ali-email {
      font-size: 15px; color: var(--text-secondary); margin-bottom: 28px;
      word-break: break-all;
    }

    .already-logged-in .ali-btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 14px 28px; border: none; border-radius: 14px;
      background: var(--accent); color: #fff;
      font-family: inherit; font-size: 16px; font-weight: 600;
      cursor: pointer; text-decoration: none; margin-bottom: 16px;
      width: 100%; max-width: 260px;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s;
    }

    .already-logged-in .ali-btn:active { transform: scale(0.98); }

    .already-logged-in .ali-switch {
      font-size: 14px; color: var(--red);
      background: none; border: none; cursor: pointer;
      font-family: inherit; padding: 8px 0;
      -webkit-tap-highlight-color: transparent;
    }

    @media (max-width: 480px) {
      body { padding: 16px; }
      .auth-card { padding: 20px; }
    }
  </style>
</head>

<body>
  <div class="auth-container">
    <div class="auth-header">
      <img src="RdotA.png" alt="RdotA" class="auth-logo">
      <h1>RdotA</h1>
      <p>Sign in to continue</p>
    </div>

    <div class="auth-card">
      <div class="already-logged-in" id="alreadyLoggedIn">
        <div class="ali-avatar" id="aliAvatar"></div>
        <h2>You're already signed in</h2>
        <p class="ali-email" id="aliEmail"></p>
        <a href="index.html" class="ali-btn">Go to Generators</a>
        <button class="ali-switch" id="aliSignOut">Sign out & switch account</button>
      </div>

      <div id="authForms">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin">Sign In</button>
        <button class="auth-tab" id="tabSignup">Sign Up</button>
      </div>

      <div class="auth-error" id="authError"></div>
      <div class="auth-success" id="authSuccess"></div>

      <form class="auth-form active" id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="Your password" required autocomplete="current-password">
        </div>
        <button type="submit" class="auth-btn" id="loginBtn">Sign In</button>
        <button type="button" class="forgot-link" id="forgotLink">Forgot password?</button>
      </form>

      <form class="auth-form" id="forgotForm">
        <div class="form-group">
          <label for="forgotEmail">Email</label>
          <input type="email" id="forgotEmail" placeholder="you@example.com" required autocomplete="email">
        </div>
        <button type="submit" class="auth-btn" id="forgotBtn">Send Reset Link</button>
        <button type="button" class="forgot-link" id="backToLogin">Back to Sign In</button>
      </form>

      <form class="auth-form" id="signupForm">
        <div class="form-group">
          <label for="signupEmail">Email</label>
          <input type="email" id="signupEmail" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" placeholder="Min 6 characters" required minlength="6" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="signupConfirm">Confirm Password</label>
          <input type="password" id="signupConfirm" placeholder="Repeat password" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="auth-btn" id="signupBtn">Create Account</button>
      </form>
      </div>
    </div>

    <div class="auth-footer">
      Powered by RdotA
    </div>
  </div>

  <script>
    (function() {
      var sb = null;
      var errEl = document.getElementById('authError');
      var successEl = document.getElementById('authSuccess');
      var tabLogin = document.getElementById('tabLogin');
      var tabSignup = document.getElementById('tabSignup');
      var loginForm = document.getElementById('loginForm');
      var signupForm = document.getElementById('signupForm');
      var forgotForm = document.getElementById('forgotForm');
      var loginBtn = document.getElementById('loginBtn');
      var signupBtn = document.getElementById('signupBtn');
      var forgotBtn = document.getElementById('forgotBtn');
      var forgotLink = document.getElementById('forgotLink');
      var backToLogin = document.getElementById('backToLogin');
      var tabs = [tabLogin, tabSignup];

      function showError(msg) {
        errEl.textContent = msg;
        errEl.classList.add('visible');
        successEl.classList.remove('visible');
      }

      function showSuccess(msg) {
        successEl.textContent = msg;
        successEl.classList.add('visible');
        errEl.classList.remove('visible');
      }

      function hideMessages() {
        errEl.classList.remove('visible');
        successEl.classList.remove('visible');
      }

      function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);
      }

      function friendlyError(msg) {
        var m = msg.toLowerCase();
        if (m.indexOf('invalid login credentials') !== -1 || m.indexOf('invalid_credentials') !== -1) return 'Incorrect email or password. Double-check and try again.';
        if (m.indexOf('email not confirmed') !== -1) return "Your email hasn't been confirmed yet — check your inbox.";
        if (m.indexOf('already registered') !== -1 || m.indexOf('already been registered') !== -1) return 'This email is already in use. Try signing in instead.';
        if (m.indexOf('rate limit') !== -1 || m.indexOf('too many requests') !== -1 || m.indexOf('email_send_rate') !== -1) return 'Too many attempts — wait a minute and try again.';
        if (m.indexOf('password') !== -1 && m.indexOf('at least') !== -1) return 'Password must be at least 6 characters.';
        if (m.indexOf('signup is disabled') !== -1) return 'Sign-ups are currently closed.';
        if (m.indexOf('email_address_invalid') !== -1 || m.indexOf('invalid email') !== -1) return "That email address isn't valid — check for typos.";
        return msg;
      }

      function switchTab(tab) {
        tabs.forEach(function(t) { t.classList.remove('active'); });
        loginForm.classList.remove('active');
        signupForm.classList.remove('active');
        forgotForm.classList.remove('active');
        hideMessages();

        if (tab === 'login') {
          tabLogin.classList.add('active');
          loginForm.classList.add('active');
          document.body.classList.remove('signup-active');
        } else if (tab === 'signup') {
          tabSignup.classList.add('active');
          signupForm.classList.add('active');
          document.body.classList.add('signup-active');
        } else if (tab === 'forgot') {
          forgotForm.classList.add('active');
          document.body.classList.remove('signup-active');
        }
      }

      tabLogin.addEventListener('click', function() { switchTab('login'); });
      tabSignup.addEventListener('click', function() { switchTab('signup'); });
      forgotLink.addEventListener('click', function() { switchTab('forgot'); });
      backToLogin.addEventListener('click', function() { switchTab('login'); });

      loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        hideMessages();
        if (!sb) { showError('Auth service not loaded — refresh the page'); return; }

        var email = document.getElementById('loginEmail').value.trim();
        var password = document.getElementById('loginPassword').value;

        if (!email) { showError('Please enter your email address.'); return; }
        if (!isValidEmail(email)) { showError("That doesn't look like a valid email — check for typos."); return; }
        if (!password) { showError('Please enter your password.'); return; }

        loginBtn.disabled = true;
        loginBtn.textContent = 'Signing in...';

        sb.auth.signInWithPassword({ email: email, password: password }).then(function(res) {
          if (res.error) {
            showError(friendlyError(res.error.message));
            loginBtn.disabled = false;
            loginBtn.textContent = 'Sign In';
            return;
          }
          window.location.href = 'index.html';
        }).catch(function(err) {
          showError('Connection error — check your internet and try again.');
          loginBtn.disabled = false;
          loginBtn.textContent = 'Sign In';
        });
      });

      signupForm.addEventListener('submit', function(e) {
        e.preventDefault();
        hideMessages();
        if (!sb) { showError('Auth service not loaded — refresh the page'); return; }

        var email = document.getElementById('signupEmail').value.trim();
        var password = document.getElementById('signupPassword').value;
        var confirm = document.getElementById('signupConfirm').value;

        if (!email) { showError('Please enter your email address.'); return; }
        if (!isValidEmail(email)) { showError("That doesn't look like a valid email — check for typos."); return; }
        if (!password) { showError('Please choose a password.'); return; }
        if (password.length < 6) { showError('Password must be at least 6 characters.'); return; }
        if (password !== confirm) { showError("Passwords don't match — try retyping them."); return; }

        signupBtn.disabled = true;
        signupBtn.textContent = 'Creating account...';

        sb.auth.signUp({ email: email, password: password }).then(function(res) {
          if (res.error) {
            showError(friendlyError(res.error.message));
            signupBtn.disabled = false;
            signupBtn.textContent = 'Create Account';
            return;
          }

          if (res.data && res.data.user && res.data.user.identities && res.data.user.identities.length === 0) {
            showError('This email is already in use. Try signing in instead.');
            signupBtn.disabled = false;
            signupBtn.textContent = 'Create Account';
            return;
          }

          showSuccess('Account created! Check your email to confirm, then sign in.');
          signupBtn.disabled = false;
          signupBtn.textContent = 'Create Account';
          switchTab('login');
        }).catch(function(err) {
          showError('Connection error — check your internet and try again.');
          signupBtn.disabled = false;
          signupBtn.textContent = 'Create Account';
        });
      });

      forgotForm.addEventListener('submit', function(e) {
        e.preventDefault();
        hideMessages();
        if (!sb) { showError('Auth service not loaded — refresh the page'); return; }

        var email = document.getElementById('forgotEmail').value.trim();

        if (!email) { showError('Please enter your email address.'); return; }
        if (!isValidEmail(email)) { showError("That doesn't look like a valid email — check for typos."); return; }

        forgotBtn.disabled = true;
        forgotBtn.textContent = 'Sending...';

        sb.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + window.location.pathname.replace('login.html', 'reset-password.html')
        }).then(function(res) {
          if (res.error) {
            showError(friendlyError(res.error.message));
            forgotBtn.disabled = false;
            forgotBtn.textContent = 'Send Reset Link';
            return;
          }
          showSuccess('Reset link sent! Check your inbox.');
          forgotBtn.disabled = false;
          forgotBtn.textContent = 'Send Reset Link';
        }).catch(function(err) {
          showError('Connection error — check your internet and try again.');
          forgotBtn.disabled = false;
          forgotBtn.textContent = 'Send Reset Link';
        });
      });

      try {
        sb = window.supabase.createClient(
          'https://dvzwupfryffqptjyxlmn.supabase.co',
          'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2end1cGZyeWZmcXB0anl4bG1uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NjIwMTksImV4cCI6MjA5NjMzODAxOX0.lAIScl3PIpfQEAYd7Im22mjAMQxNHF1663Z5moYO9sY'
        );
        sb.auth.getSession().then(function(res) {
          if (res.data && res.data.session) {
            var session = res.data.session;
            var email = session.user.email || '';
            var meta = session.user.user_metadata || {};
            var avatar = localStorage.getItem('rdota_avatar') || meta.avatar_url || '';
            var initial = (localStorage.getItem('rdota_initial') || email.charAt(0) || '?').toUpperCase();

            var formsEl = document.getElementById('authForms');
            if (formsEl) formsEl.style.display = 'none';
            var panel = document.getElementById('alreadyLoggedIn');
            if (panel) panel.style.display = 'flex';

            var aliAvatar = document.getElementById('aliAvatar');
            if (avatar) {
              aliAvatar.style.backgroundImage = 'url(' + avatar + ')';
              aliAvatar.style.backgroundSize = 'cover';
              aliAvatar.style.backgroundPosition = 'center';
              aliAvatar.textContent = '';
            } else {
              aliAvatar.textContent = initial;
            }

            document.getElementById('aliEmail').textContent = email;

            document.getElementById('aliSignOut').addEventListener('click', function() {
              localStorage.removeItem('rdota_avatar');
              localStorage.removeItem('rdota_initial');
              localStorage.removeItem('disclaimer_accepted');
              localStorage.removeItem('sains_history');
              localStorage.removeItem('ean13_history');
              Object.keys(localStorage).forEach(function(key) {
                if (key.startsWith('sb-')) localStorage.removeItem(key);
              });
              sb.auth.signOut().finally(function() {
                window.location.reload();
              });
            });
          }
        });
      } catch(e) {
        console.error('Supabase init failed:', e);
      }
    })();
  </script>
</body>
</html>

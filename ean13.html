<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EAN-13 Barcode Generator</title>
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="RdotA.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0a0f;
      --bg-card: #12121a;
      --bg-input: #1a1a26;
      --border: #2a2a3a;
      --border-focus: #6c5ce7;
      --text-primary: #e8e8f0;
      --text-secondary: #8888a0;
      --text-muted: #55556a;
      --accent: #6c5ce7;
      --accent-hover: #7d6ff0;
      --accent-glow: rgba(108, 92, 231, 0.25);
      --success: #00cec9;
      --danger: #ff6b6b;
      --radius: 12px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -40%;
      left: -20%;
      width: 60%;
      height: 80%;
      background: radial-gradient(circle, rgba(108, 92, 231, 0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -40%;
      right: -20%;
      width: 60%;
      height: 80%;
      background: radial-gradient(circle, rgba(0, 206, 201, 0.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 540px;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--accent);
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 20px;
      transition: border-color 0.3s ease;
    }

    .card:hover {
      border-color: #3a3a4a;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    .input-row input {
      flex: 1;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-family: 'Inter', monospace;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 3px;
      outline: none;
      transition: all 0.25s ease;
    }

    input[type="text"]::placeholder {
      color: var(--text-muted);
      letter-spacing: 1px;
      font-size: 14px;
    }

    input[type="text"]:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .check-digit-display {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 54px;
      height: 54px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0;
      transition: all 0.3s ease;
    }

    .check-digit-display.active {
      border-color: var(--accent);
      background: rgba(108, 92, 231, 0.08);
    }

    .info-text {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .info-text.success-text {
      color: var(--success);
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
    }

    .btn-row>button {
      flex: 1 1 auto;
      min-width: calc(33.333% - 12px);
    }

    button {
      flex: 1;
      padding: 14px 20px;
      border: none;
      border-radius: var(--radius);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }

    .btn-generate {
      background: var(--accent);
      color: #fff;
    }

    .btn-generate:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .btn-generate:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-generate:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-template {
      background: var(--bg-input);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-template:hover {
      background: #22222e;
      border-color: #4a4a5a;
    }

    /* Barcode Output */
    .barcode-output {
      display: none;
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .barcode-output.visible {
      display: block;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .barcode-wrapper {
      background: #ffffff;
      border-radius: 14px;
      padding: 24px 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 12px;
    }

    .barcode-wrapper svg {
      width: 100%;
      max-width: 420px;
      height: auto;
    }

    .barcode-digits {
      text-align: center;
      padding-top: 10px;
      font-size: 17px;
      font-weight: 500;
      color: #333333;
      letter-spacing: 2.5px;
      font-family: 'Inter', 'Courier New', monospace;
    }

    .btn-download {
      width: 100%;
      padding: 12px;
      background: transparent;
      color: var(--success);
      border: 1px solid rgba(0, 206, 201, 0.3);
      font-size: 13px;
    }

    .btn-download:hover {
      background: rgba(0, 206, 201, 0.06);
      border-color: var(--success);
    }

    .main-nav a:hover {
      background: rgba(67, 97, 238, 0.1);
      color: var(--primary);
    }

    /* History */
    .history-section {
      margin-top: 8px;
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .history-header h3 {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .btn-clear-history {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      padding: 4px 8px;
      font-family: 'Inter', sans-serif;
      flex: none;
    }

    .btn-clear-history:hover {
      color: var(--danger);
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
    }

    .history-list::-webkit-scrollbar {
      width: 4px;
    }

    .history-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .history-list::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    /* History Swipe to Delete */
    .history-item-wrapper {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 6px;
      user-select: none;
      touch-action: pan-y;
      background: #ff3b30; /* iOS Red background behind sliding element */
    }

    .history-delete-btn {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 80px;
      background: #ff3b30;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      z-index: 1;
      cursor: pointer;
      pointer-events: auto;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg-input);
      border-radius: 8px;
      cursor: pointer;
      position: relative;
      z-index: 2;
      border: 1px solid var(--bg-input);
      margin-bottom: 0;
    }

    .history-item:hover {
      border-color: var(--border);
      background: #1e1e2a;
    }

    .history-item-code {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 2px;
      font-family: 'Inter', monospace;
    }

    .history-item-time {
      font-size: 11px;
      color: var(--text-muted);
    }

    .empty-history {
      text-align: center;
      padding: 20px;
      font-size: 13px;
      color: var(--text-muted);
    }

    @media (max-width: 480px) {
      .container {
        max-width: 100%;
      }

      .card {
        padding: 20px;
      }

      .header h1 {
        font-size: 24px;
      }

      .btn-row {
        flex-direction: column;
      }

      input[type="text"] {
        font-size: 16px;
        letter-spacing: 2px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:24px;">
      <a href="index.html" class="back-link" style="margin-bottom:0;">← Back</a>
      <a href="profile.html" id="navProfileBtn" style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;border:2px solid #2a2a3a;overflow:hidden;cursor:pointer;transition:border-color 0.2s;flex-shrink:0;text-decoration:none;" title="Profile"><svg width="36" height="36" viewBox="0 0 36 36" fill="none"><circle cx="18" cy="13" r="6" fill="#55556a"/><ellipse cx="18" cy="32" rx="12" ry="9" fill="#55556a"/></svg></a><script>(function(){var av=localStorage.getItem('rdota_avatar'),init=localStorage.getItem('rdota_initial'),btn=document.getElementById('navProfileBtn');if(!btn)return;if(av){btn.innerHTML='<img src="'+av+'" style="width:100%;height:100%;object-fit:cover;">';}else if(init){btn.innerHTML='<span style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:#6c5ce7;color:#fff;font-size:15px;font-weight:700;font-family:Inter,sans-serif;">'+init+'</span>';}})();</script>
    </div>

    <div class="header">
      <h1>EAN-13 Generator</h1>
      <p>Generate valid EAN-13 barcodes with automatic check digit calculation</p>
    </div>

    <!-- Input Card -->
    <div class="card">
      <div class="input-group">
        <label>Enter 12 digits (check digit auto-calculated)</label>
        <div class="input-row">
          <input type="text" id="barcodeInput" placeholder="e.g. 9912345678909" maxlength="12" autocomplete="off">
          <div class="check-digit-display" id="checkDigitDisplay">–</div>
        </div>
        <div class="info-text" id="infoText">
          <span>Enter exactly 12 numeric digits</span>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn-generate" id="generateBtn" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2" />
            <line x1="6" y1="8" x2="6" y2="16" />
            <line x1="9" y1="8" x2="9" y2="16" />
            <line x1="12" y1="8" x2="12" y2="16" />
            <line x1="15" y1="8" x2="15" y2="16" />
            <line x1="18" y1="8" x2="18" y2="16" />
          </svg>
          Generate
        </button>
      </div>
    </div>

    <!-- Barcode Output -->
    <div class="card barcode-output" id="barcodeOutput">
      <div class="barcode-wrapper">
        <svg id="barcodeSvg"></svg>
        <div class="barcode-digits" id="barcodeDigits"></div>
      </div>
      <button class="btn-download" id="downloadBtn" style="margin-top: 16px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        Download PNG
      </button>
    </div>

    <!-- History -->
    <div class="card history-section">
      <div class="history-header">
        <h3>Recent</h3>
        <button class="btn-clear-history" id="clearHistoryBtn">Clear</button>
      </div>
      <div class="history-list" id="historyList">
        <div class="empty-history">No barcodes generated yet</div>
      </div>
    </div>
  </div>

  <script>
    function calculateCheckDigit(digits12) {
      if (digits12.length !== 12 || !/^\d{12}$/.test(digits12)) return null;
      let sum = 0;
      for (let i = 0; i < 12; i++) {
        const d = parseInt(digits12[i], 10);
        sum += (i % 2 === 0) ? d : d * 3;
      }
      const remainder = sum % 10;
      return remainder === 0 ? 0 : 10 - remainder;
    }

    const input = document.getElementById('barcodeInput');
    const checkDigitDisplay = document.getElementById('checkDigitDisplay');
    const infoText = document.getElementById('infoText');
    const generateBtn = document.getElementById('generateBtn');
    const barcodeOutput = document.getElementById('barcodeOutput');
    const barcodeSvg = document.getElementById('barcodeSvg');
    const downloadBtn = document.getElementById('downloadBtn');
    const historyList = document.getElementById('historyList');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');

    let history = JSON.parse(localStorage.getItem('ean13_history') || '[]');

    input.addEventListener('input', (e) => {
      let val = e.target.value.replace(/\D/g, '').slice(0, 12);
      e.target.value = val;

      if (val.length === 12) {
        const cd = calculateCheckDigit(val);
        checkDigitDisplay.textContent = cd;
        checkDigitDisplay.classList.add('active');
        generateBtn.disabled = false;
        infoText.innerHTML = `<span class="success-text">✓ Valid — full barcode: ${val}${cd}</span>`;
        infoText.className = 'info-text success-text';
      } else if (val.length > 0) {
        checkDigitDisplay.textContent = '–';
        checkDigitDisplay.classList.remove('active');
        generateBtn.disabled = true;
        infoText.innerHTML = `<span>${val.length}/12 digits entered</span>`;
        infoText.className = 'info-text';
      } else {
        checkDigitDisplay.textContent = '–';
        checkDigitDisplay.classList.remove('active');
        generateBtn.disabled = true;
        infoText.innerHTML = '<span>Enter exactly 12 numeric digits</span>';
        infoText.className = 'info-text';
      }
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !generateBtn.disabled) generateBarcode();
    });

    generateBtn.addEventListener('click', generateBarcode);

    function generateBarcode() {
      const val = input.value.replace(/\D/g, '');
      if (val.length !== 12) return;

      const cd = calculateCheckDigit(val);
      const full = val + cd;

      try {
        JsBarcode('#barcodeSvg', full, {
          format: 'EAN13',
          width: 2.8,
          height: 100,
          displayValue: true,
          fontSize: 1,
          textColor: '#ffffff',
          textMargin: 0,
          margin: 12,
          marginTop: 16,
          marginBottom: 4,
          background: '#ffffff',
          lineColor: '#000000',
          flat: true,
        });

        const svgTexts = barcodeSvg.querySelectorAll('text');
        svgTexts.forEach(t => t.remove());

        barcodeOutput.classList.add('visible');
        document.getElementById('barcodeDigits').textContent = full;

        barcodeOutput.style.animation = 'none';
        barcodeOutput.offsetHeight;
        barcodeOutput.style.animation = '';

        addToHistory(full);
      } catch (err) {
        console.error('Barcode generation error:', err);
      }
    }

    downloadBtn.addEventListener('click', () => {
      const svgData = new XMLSerializer().serializeToString(barcodeSvg);
      const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);

      const img = new Image();
      img.onload = () => {
        const scale = 3;
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.scale(scale, scale);
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);

        const pngUrl = canvas.toDataURL('image/png');
        const a = document.createElement('a');
        a.href = pngUrl;
        a.download = `EAN13_${input.value}${calculateCheckDigit(input.value)}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };
      img.src = url;
    });

    function addToHistory(code) {
      history = history.filter(item => item.code !== code);
      history.unshift({ code, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
      if (history.length > 20) history.pop();
      localStorage.setItem('ean13_history', JSON.stringify(history));
      renderHistory();
    }

    let activeSwipeItem = null;

    function closeAllSwipeItems() {
      document.querySelectorAll('.history-item-wrapper').forEach(w => {
        w.classList.remove('swiped');
        const item = w.querySelector('.history-item');
        const btn = w.querySelector('.history-delete-btn');
        if (item) {
          item.style.transform = '';
          item.style.transition = 'transform 0.25s cubic-bezier(0.16, 1, 0.3, 1)';
        }
        if (btn) {
          btn.style.width = '';
          btn.style.transition = 'width 0.25s cubic-bezier(0.16, 1, 0.3, 1)';
        }
      });
      activeSwipeItem = null;
    }

    function deleteHistoryItem(code) {
      const wrapper = document.querySelector(`.history-item-wrapper[data-code="${code}"]`);
      if (wrapper) {
        wrapper.style.transition = 'all 0.35s cubic-bezier(0.16, 1, 0.3, 1)';
        wrapper.style.height = wrapper.offsetHeight + 'px';
        wrapper.offsetHeight; // force reflow
        wrapper.style.transform = 'translateX(-110%)';
        wrapper.style.opacity = '0';
        wrapper.style.height = '0';
        wrapper.style.marginBottom = '0';
        wrapper.style.paddingTop = '0';
        wrapper.style.paddingBottom = '0';

        setTimeout(() => {
          history = history.filter(item => item.code !== code);
          localStorage.setItem('ean13_history', JSON.stringify(history));
          renderHistory();
        }, 320);
      }
    }

    function initSwipeGestures() {
      const wrappers = document.querySelectorAll('.history-item-wrapper');

      wrappers.forEach(wrapper => {
        const item = wrapper.querySelector('.history-item');
        const btn = wrapper.querySelector('.history-delete-btn');
        if (!item || !btn) return;

        let startX = 0;
        let startY = 0;
        let isSwiping = false;
        let isDirectionChecked = false;
        let alreadyOpen = false;

        const handleStart = (clientX, clientY) => {
          alreadyOpen = wrapper.classList.contains('swiped');
          if (!alreadyOpen) {
            closeAllSwipeItems();
          }

          startX = clientX;
          startY = clientY;
          isSwiping = false;
          isDirectionChecked = false;

          item.style.transition = 'none';
          btn.style.transition = 'none';
          wrapper.removeAttribute('data-dragging');
        };

        const handleMove = (clientX, clientY) => {
          const dx = startX - clientX;
          const dy = startY - clientY;

          if (!isDirectionChecked) {
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 6) {
              isSwiping = true;
              wrapper.setAttribute('data-dragging', 'true');
            }
            isDirectionChecked = true;
          }

          if (!isSwiping) return;

          let targetX = alreadyOpen ? -80 - dx : -dx;

          if (targetX > 0) {
            targetX = 0;
          }

          item.style.transform = `translateX(${targetX}px)`;

          if (targetX < -80) {
            btn.style.width = `${Math.abs(targetX)}px`;
          } else {
            btn.style.width = '80px';
          }
        };

        const handleEnd = (clientX) => {
          if (!isSwiping) return;

          const dx = startX - clientX;
          let finalX = alreadyOpen ? -80 - dx : -dx;

          item.style.transition = 'transform 0.25s cubic-bezier(0.16, 1, 0.3, 1)';
          btn.style.transition = 'width 0.25s cubic-bezier(0.16, 1, 0.3, 1)';

          if (finalX < -200) {
            // Full Swipe: Instantly delete!
            item.style.transform = 'translateX(-110%)';
            btn.style.width = '100%';
            deleteHistoryItem(wrapper.dataset.code);
          } else if (finalX < -40) {
            // Snap to reveal Delete button
            item.style.transform = 'translateX(-80px)';
            btn.style.width = '80px';
            wrapper.classList.add('swiped');
            activeSwipeItem = wrapper;
          } else {
            // Snap back closed
            item.style.transform = 'translateX(0)';
            btn.style.width = '80px';
            wrapper.classList.remove('swiped');
            // Clean dragging state shortly after so click event ignores it
            setTimeout(() => {
              wrapper.removeAttribute('data-dragging');
            }, 50);
          }
        };

        // Touch events
        item.addEventListener('touchstart', (e) => {
          handleStart(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });

        item.addEventListener('touchmove', (e) => {
          const dx = startX - e.touches[0].clientX;
          const dy = startY - e.touches[0].clientY;
          if (Math.abs(dx) > Math.abs(dy)) {
            if (e.cancelable) e.preventDefault();
          }
          handleMove(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        item.addEventListener('touchend', (e) => {
          handleEnd(e.changedTouches[0].clientX);
        });

        // Mouse events
        let isMouseDown = false;
        item.addEventListener('mousedown', (e) => {
          isMouseDown = true;
          handleStart(e.clientX, e.clientY);
        });

        window.addEventListener('mousemove', (e) => {
          if (!isMouseDown) return;
          handleMove(e.clientX, e.clientY);
        });

        window.addEventListener('mouseup', (e) => {
          if (!isMouseDown) return;
          isMouseDown = false;
          handleEnd(e.clientX);
        });
      });
    }

    function renderHistory() {
      if (history.length === 0) {
        historyList.innerHTML = '<div class="empty-history">No barcodes generated yet</div>';
        return;
      }
      historyList.innerHTML = history.map(item => `
        <div class="history-item-wrapper" data-code="${item.code}">
          <div class="history-delete-btn">Delete</div>
          <div class="history-item">
            <span class="history-item-code">${item.code}</span>
            <span class="history-item-time">${item.time}</span>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.history-item').forEach(el => {
        el.addEventListener('click', (e) => {
          const wrapper = el.closest('.history-item-wrapper');
          
          // Ignore clicks if we were dragging
          if (wrapper.getAttribute('data-dragging') === 'true') {
            wrapper.removeAttribute('data-dragging');
            return;
          }

          if (wrapper.classList.contains('swiped')) {
            closeAllSwipeItems();
            return;
          }

          input.value = wrapper.dataset.code.slice(0, 12);
          input.dispatchEvent(new Event('input'));
          generateBarcode();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });

      document.querySelectorAll('.history-delete-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const wrapper = btn.closest('.history-item-wrapper');
          deleteHistoryItem(wrapper.dataset.code);
        });
      });

      initSwipeGestures();
    }

    clearHistoryBtn.addEventListener('click', () => {
      history = [];
      localStorage.removeItem('ean13_history');
      renderHistory();
    });

    renderHistory();
  </script>
</body>

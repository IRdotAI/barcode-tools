<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sainsbury's Barcode Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #0a0a0f;
      --bg-card:    #12121a;
      --bg-input:   #1a1a26;
      --border:     #2a2a3a;
      --border-focus: #6c5ce7;
      --text-primary:   #e8e8f0;
      --text-secondary: #8888a0;
      --text-muted:     #55556a;
      --accent:      #6c5ce7;
      --accent-hover:#7d6ff0;
      --accent-glow: rgba(108, 92, 231, 0.25);
      --success: #00cec9;
      --danger:  #ff6b6b;
      --radius:  12px;
      --sainsbury-orange: #f06c00;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; top: -40%; left: -20%; width: 60%; height: 80%;
      background: radial-gradient(circle, rgba(108,92,231,0.06) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }
    body::after {
      content: '';
      position: fixed; bottom: -40%; right: -20%; width: 60%; height: 80%;
      background: radial-gradient(circle, rgba(0,206,201,0.04) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    .container {
      position: relative; z-index: 1;
      width: 100%; max-width: 560px;
      padding-top: 8px;
    }

    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--text-secondary); text-decoration: none;
      font-size: 13px; font-weight: 500; margin-bottom: 24px;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--accent); }

    .header {
      text-align: center; margin-bottom: 32px;
    }
    .header h1 {
      font-size: 28px; font-weight: 700; letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--sainsbury-orange) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 6px;
    }
    .header p { font-size: 14px; color: var(--text-secondary); }

    .card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 16px; padding: 24px; margin-bottom: 20px;
      transition: border-color 0.3s ease;
    }
    .card:hover { border-color: #3a3a4a; }

    .section-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.8px; color: var(--text-muted); margin-bottom: 12px;
    }

    /* ── Search input ── */
    .search-wrap { position: relative; }
    .search-wrap svg.search-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); pointer-events: none; transition: color 0.2s;
    }
    .search-wrap:focus-within svg.search-icon { color: var(--accent); }

    .search-input {
      width: 100%; padding: 13px 14px 13px 42px;
      background: var(--bg-input); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text-primary);
      font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 400;
      outline: none; transition: all 0.25s ease;
    }
    .search-input::placeholder { color: var(--text-muted); }
    .search-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-clear {
      display: none; position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%); background: none; border: none;
      color: var(--text-muted); cursor: pointer; padding: 4px;
      border-radius: 50%; transition: color 0.2s, background 0.2s;
    }
    .search-clear:hover { color: var(--text-primary); background: rgba(255,255,255,0.06); }
    .search-clear.visible { display: flex; align-items: center; justify-content: center; }

    /* ── Results list ── */
    #searchResults {
      margin-top: 14px; display: none; flex-direction: column; gap: 8px;
      max-height: 400px; overflow-y: auto;
    }
    #searchResults.visible { display: flex; }
    #searchResults::-webkit-scrollbar { width: 4px; }
    #searchResults::-webkit-scrollbar-track { background: transparent; }
    #searchResults::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .result-status {
      font-size: 12px; color: var(--text-muted); text-align: center;
      padding: 12px 0;
    }

    .product-card {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 14px; background: var(--bg-input);
      border: 1px solid var(--border); border-radius: var(--radius);
      cursor: pointer; transition: all 0.2s ease;
      text-decoration: none;
    }
    .product-card:hover {
      border-color: var(--sainsbury-orange);
      background: rgba(240, 108, 0, 0.05);
    }

    .product-thumb {
      width: 52px; height: 52px; border-radius: 8px;
      object-fit: contain; background: #fff; flex-shrink: 0;
      padding: 4px;
    }
    .product-thumb.placeholder {
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: 22px;
    }

    .product-info { flex: 1; min-width: 0; }
    .product-name {
      font-size: 13px; font-weight: 500; color: var(--text-primary);
      margin-bottom: 4px; line-height: 1.4;
    }
    .product-meta {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .product-price {
      font-size: 12px; font-weight: 600; color: var(--sainsbury-orange);
    }
    .product-gtin {
      font-size: 11px; color: var(--text-muted);
      font-family: 'Inter', monospace; letter-spacing: 1px;
    }

    .product-pick-btn {
      flex-shrink: 0; font-size: 11px; font-weight: 600;
      color: var(--accent); background: rgba(108,92,231,0.1);
      border: 1px solid rgba(108,92,231,0.25); border-radius: 8px;
      padding: 5px 10px; white-space: nowrap; transition: all 0.2s;
      pointer-events: none;
    }
    .product-card:hover .product-pick-btn {
      background: rgba(108,92,231,0.2); border-color: var(--accent);
    }

    /* ── Selected product badge ── */
    #selectedBadge {
      display: none; align-items: center; gap: 10px;
      padding: 10px 14px; background: rgba(240,108,0,0.08);
      border: 1px solid rgba(240,108,0,0.3); border-radius: var(--radius);
      margin-top: 14px;
    }
    #selectedBadge.visible { display: flex; }
    #selectedBadge img {
      width: 36px; height: 36px; border-radius: 6px;
      object-fit: contain; background: #fff; padding: 3px; flex-shrink: 0;
    }
    .selected-badge-info { flex: 1; min-width: 0; }
    .selected-badge-name {
      font-size: 13px; font-weight: 500; color: var(--text-primary);
      line-height: 1.4;
    }
    .selected-badge-price {
      font-size: 12px; font-weight: 600; color: var(--sainsbury-orange);
      margin-top: 2px;
    }
    #selectedBadgeClear {
      background: none; border: none; color: var(--text-muted);
      cursor: pointer; padding: 4px; border-radius: 4px;
      display: flex; align-items: center; transition: color 0.2s;
      flex-shrink: 0;
    }
    #selectedBadgeClear:hover { color: var(--danger); }

    /* ── Form inputs ── */
    .input-group { margin-bottom: 18px; }
    .input-group:last-of-type { margin-bottom: 0; }
    .input-group label {
      display: block; font-size: 12px; font-weight: 500;
      color: var(--text-secondary); margin-bottom: 8px;
      text-transform: uppercase; letter-spacing: 0.6px;
    }

    .price-wrap {
      position: relative;
    }
    .price-wrap .pound-sign {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      font-size: 16px; font-weight: 600; color: var(--text-muted);
      pointer-events: none;
    }
    .price-wrap:focus-within .pound-sign { color: var(--sainsbury-orange); }

    input[type="text"], input[type="number"] {
      width: 100%; padding: 13px 16px;
      background: var(--bg-input); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text-primary);
      font-family: 'Inter', monospace; font-size: 16px; font-weight: 500;
      outline: none; transition: all 0.25s ease;
    }
    .price-wrap input { padding-left: 36px; }
    input::placeholder { color: var(--text-muted); font-size: 14px; }
    input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .info-text {
      display: flex; align-items: center; gap: 6px;
      margin-top: 7px; font-size: 12px; color: var(--text-muted);
    }
    .info-text.warning { color: #f39c12; }
    .price-preview {
      font-weight: 600; color: var(--sainsbury-orange);
      transition: color 0.2s;
    }

    /* ── Generate button ── */
    .btn-generate {
      width: 100%; padding: 14px 20px; border: none;
      border-radius: var(--radius); background: var(--sainsbury-orange);
      color: #fff; font-family: 'Inter', sans-serif;
      font-size: 14px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.25s ease; margin-top: 20px;
    }
    .btn-generate:hover:not(:disabled) {
      background: #d95f00; transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(240,108,0,0.3);
    }
    .btn-generate:active:not(:disabled) { transform: translateY(0); }
    .btn-generate:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Barcode output ── */
    .barcode-output { display: none; animation: slideUp 0.4s cubic-bezier(0.16,1,0.3,1); }
    .barcode-output.visible { display: block; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .barcode-product-label {
      text-align: center; margin-bottom: 16px;
    }
    .barcode-product-label .bpl-name {
      font-size: 14px; font-weight: 600; color: var(--text-primary);
      margin-bottom: 4px; line-height: 1.4;
    }
    .barcode-product-label .bpl-price {
      font-size: 13px; font-weight: 600; color: var(--sainsbury-orange);
    }

    .barcode-wrapper {
      background: #fff; border-radius: 14px; padding: 24px;
      display: flex; flex-direction: column; align-items: center; margin-bottom: 12px;
    }
    canvas { max-width: 100%; height: auto; }

    .barcode-digits-copy {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 10px; cursor: pointer; padding: 6px 12px;
      border-radius: 8px; transition: background 0.2s;
    }
    .barcode-digits-copy:hover { background: rgba(255,255,255,0.06); }
    .barcode-digits-copy .digits {
      font-size: 13px; font-family: 'Inter', monospace; letter-spacing: 1.5px;
      color: var(--text-secondary);
    }
    .barcode-digits-copy .copy-icon { color: var(--text-muted); flex-shrink: 0; }
    .barcode-digits-copy.copied .digits { color: var(--success); }
    .barcode-digits-copy.copied .copy-icon { color: var(--success); }

    .btn-row {
      display: flex; gap: 10px;
    }

    .btn-download, .btn-share {
      flex: 1; padding: 13px 20px; border-radius: var(--radius);
      background: var(--bg-input); color: var(--text-primary);
      border: 1px solid var(--border); font-family: 'Inter', sans-serif;
      font-size: 14px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.2s; text-decoration: none;
    }
    .btn-download:hover, .btn-share:hover { background: #22222e; border-color: #4a4a5a; }

    .error-message {
      display: none; background: rgba(255,107,107,0.1);
      border: 1px solid var(--danger); color: #ff8888;
      padding: 12px 16px; border-radius: var(--radius);
      font-size: 13px; margin-bottom: 16px;
    }
    .error-message.visible { display: block; }

    /* ── History ── */
    .history-section { margin-top: 8px; }
    .history-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .history-header h3 {
      font-size: 13px; font-weight: 500; color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: 0.6px;
    }
    .btn-clear-history {
      background: none; border: none; color: var(--text-muted);
      font-size: 12px; cursor: pointer; padding: 4px 8px;
      font-family: 'Inter', sans-serif; flex: none;
    }
    .btn-clear-history:hover { color: var(--danger); }

    .history-list {
      display: flex; flex-direction: column; gap: 6px;
      max-height: 220px; overflow-y: auto;
    }
    .history-list::-webkit-scrollbar { width: 4px; }
    .history-list::-webkit-scrollbar-track { background: transparent; }
    .history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .history-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; background: var(--bg-input);
      border: 1px solid var(--bg-input); border-radius: 8px;
      cursor: pointer; transition: all 0.2s;
    }
    .history-item:hover { border-color: var(--border); background: #1e1e2a; }
    .history-item-name {
      font-size: 12px; font-weight: 500; color: var(--text-primary);
      flex: 1; min-width: 0; margin-right: 12px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .history-item-price {
      font-size: 12px; font-weight: 600; color: var(--sainsbury-orange);
      flex-shrink: 0; margin-right: 12px;
    }
    .history-item-time {
      font-size: 11px; color: var(--text-muted); flex-shrink: 0;
    }
    .history-item-delete {
      background: none; border: none; color: var(--text-muted);
      cursor: pointer; padding: 2px 6px; margin-left: 8px;
      font-size: 14px; line-height: 1; border-radius: 4px;
      transition: color 0.2s; flex-shrink: 0;
    }
    .history-item-delete:hover { color: var(--danger); }

    .empty-history {
      text-align: center; padding: 20px;
      font-size: 13px; color: var(--text-muted);
    }

    /* spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }

    @media (max-width: 480px) {
      .container { max-width: 100%; }
      .card { padding: 18px; }
      .header h1 { font-size: 24px; }
      .btn-row { flex-direction: column; }
    }
  </style>
</head>

<body>
  <div class="container">
    <a href="generators.html" class="back-link">← Back</a>

    <div class="header">
      <h1>Sainsbury's Generator</h1>
      <p>Search for a product, then encode a custom price</p>
    </div>

    <!-- Step 1: Product Search -->
    <div class="card">
      <div class="section-label">Step 1 — Find a product</div>

      <div class="search-wrap">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          type="text"
          class="search-input"
          id="searchInput"
          placeholder="e.g. semi skimmed milk, bread, cheddar..."
          autocomplete="off"
        >
        <button class="search-clear" id="searchClear" aria-label="Clear search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div id="searchResults"></div>

      <div id="selectedBadge">
        <img id="selectedBadgeImg" src="" alt="">
        <div class="selected-badge-info">
          <div class="selected-badge-name" id="selectedBadgeName"></div>
          <div class="selected-badge-price" id="selectedBadgePrice"></div>
        </div>
        <button id="selectedBadgeClear" title="Clear selection">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Step 2: Price + generate -->
    <div class="card">
      <div class="section-label">Step 2 — Set a price &amp; generate</div>

      <div class="error-message" id="errorMessage"></div>

      <div class="input-group">
        <label for="productCode">Product Barcode (EAN-13)</label>
        <input
          type="text"
          id="productCode"
          placeholder="Auto-filled from search, or enter manually"
          maxlength="13"
          inputmode="numeric"
          oninput="this.value=this.value.replace(/\D/g,'').slice(0,13)"
        >
        <div class="info-text">The original product EAN-13 code</div>
      </div>

      <div class="input-group">
        <label for="price">Price</label>
        <div class="price-wrap">
          <span class="pound-sign">£</span>
          <input
            type="text"
            id="price"
            placeholder="e.g. 1.50"
            inputmode="decimal"
            autocomplete="off"
          >
        </div>
        <div class="info-text" id="priceInfo">
          <span class="price-preview" id="pricePreview"></span>
        </div>
        <div class="info-text warning">⚠ Prices below £0.10 may be flagged</div>
      </div>

      <button class="btn-generate" onclick="generateBarcode()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <line x1="6" y1="8" x2="6" y2="16"/><line x1="9" y1="8" x2="9" y2="16"/>
          <line x1="12" y1="8" x2="12" y2="16"/><line x1="15" y1="8" x2="15" y2="16"/>
          <line x1="18" y1="8" x2="18" y2="16"/>
        </svg>
        Generate Barcode
      </button>
    </div>

    <!-- Output -->
    <div class="barcode-output" id="barcodeOutput">
      <div class="card">
        <div class="barcode-product-label" id="barcodeLabel">
          <div class="bpl-name" id="barcodeLabelName"></div>
          <div class="bpl-price" id="barcodeLabelPrice"></div>
        </div>
        <div class="barcode-wrapper">
          <canvas id="barcodeCanvas"></canvas>
        </div>
        <div class="barcode-digits-copy" id="copyBarcode" title="Tap to copy">
          <span class="digits" id="barcodeDigitsText"></span>
          <svg class="copy-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </div>
        <div class="btn-row">
          <a id="downloadLink" download="sainsbury-barcode.png" class="btn-download">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Download
          </a>
          <button class="btn-share" id="shareBtn" style="display:none">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/>
              <circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
            </svg>
            Share
          </button>
        </div>
      </div>
    </div>

    <!-- History -->
    <div class="card history-section" id="historySection">
      <div class="history-header">
        <h3>Recent</h3>
        <button class="btn-clear-history" id="clearHistoryBtn">Clear</button>
      </div>
      <div class="history-list" id="historyList">
        <div class="empty-history">No barcodes generated yet</div>
      </div>
    </div>
  </div>

  <script>
    // ── Sainsbury's product search via Playwright backend ────────────────────────
    const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? 'http://localhost:8000'
      : 'https://sainsburys-api.onrender.com';

    async function fetchSainsburys(q) {
      const url = `${API_BASE}/api/sainsburys?q=${encodeURIComponent(q)}&page_size=24`;
      const controller = new AbortController();
      const t = setTimeout(() => controller.abort(), 120000);

      try {
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(t);
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `API returned ${res.status}`);
        }
        const data = await res.json();
        return {
          products: (data.products || []).map(p => ({
            name:  p.name  || '',
            image: p.image || '',
            ean:   p.ean   || '',
            price: p.price,
            brand: p.brand || '',
          })),
        };
      } catch (err) {
        clearTimeout(t);
        throw err.name === 'AbortError'
          ? new Error('search timed out — the server may be waking up, try again in a few seconds')
          : err;
      }
    }

    // ── Search ────────────────────────────────────────────────────────────────
    const searchInput   = document.getElementById('searchInput');
    const searchClear   = document.getElementById('searchClear');
    const searchResults = document.getElementById('searchResults');
    const selectedBadge = document.getElementById('selectedBadge');

    let debounceTimer = null;
    let currentQuery  = '';
    let selectedProduct = null;

    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim();
      searchClear.classList.toggle('visible', q.length > 0);
      clearTimeout(debounceTimer);

      if (!q) {
        hideResults();
        return;
      }

      showStatus('<span class="spinner"></span> <span style="margin-left:8px">Searching Sainsbury\'s — first search may take up to a minute...</span>');
      searchResults.classList.add('visible');

      debounceTimer = setTimeout(() => doSearch(q), 800);
    });

    searchClear.addEventListener('click', () => {
      searchInput.value = '';
      searchClear.classList.remove('visible');
      hideResults();
      searchInput.focus();
    });

    function hideResults() {
      searchResults.classList.remove('visible');
      searchResults.innerHTML = '';
      currentQuery = '';
    }

    function showStatus(html) {
      searchResults.innerHTML = `<div class="result-status">${html}</div>`;
    }

    async function doSearch(q) {
      if (q === currentQuery) return;
      currentQuery = q;

      try {
        const data = await fetchSainsburys(q);
        if (q !== currentQuery) return;

        const products = (data.products || [])
          .filter(p => p.ean)
          .map(p => ({
            name:  p.name  || 'Unknown product',
            image: p.image || '',
            price: p.price != null ? p.price : null,
            priceText: p.price != null ? `£${Number(p.price).toFixed(2)}` : '',
            brand: p.brand || '',
            ean:   p.ean,
          }));

        if (products.length === 0) {
          showStatus('No products found — try a different search term');
          return;
        }

        renderResults(products);
      } catch (err) {
        if (q !== currentQuery) return;
        showStatus(`<span style="color:var(--danger)">⚠ Search failed — ${err.message}</span>`);
      }
    }

    function renderResults(products) {
      searchResults.innerHTML = products.map((p, i) => {
        const thumb = p.image
          ? `<img class="product-thumb" src="${esc(p.image)}" alt="" loading="lazy"
               onerror="this.outerHTML='<div class=\\'product-thumb placeholder\\'>🛒</div>'">`
          : `<div class="product-thumb placeholder">🛒</div>`;

        return `
          <div class="product-card" data-index="${i}" role="button" tabindex="0">
            ${thumb}
            <div class="product-info">
              <div class="product-name">${esc(p.name)}</div>
              <div class="product-meta">
                ${p.priceText ? `<span class="product-price">${esc(p.priceText)}</span>` : ''}
                ${p.brand ? `<span class="product-gtin" style="color:var(--text-secondary)">${esc(p.brand)}</span>` : ''}
                ${p.ean   ? `<span class="product-gtin">${esc(p.ean)}</span>`   : ''}
              </div>
            </div>
            <span class="product-pick-btn">Select</span>
          </div>`;
      }).join('');

      searchResults.querySelectorAll('.product-card').forEach((card, i) => {
        const handler = () => selectProduct(products[i]);
        card.addEventListener('click', handler);
        card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') handler(); });
      });
    }

    function selectProduct(p) {
      selectedProduct = p;

      if (p.ean) document.getElementById('productCode').value = p.ean;

      document.getElementById('selectedBadgeName').textContent = p.name;
      document.getElementById('selectedBadgePrice').textContent = p.priceText || '';
      const img = document.getElementById('selectedBadgeImg');
      img.src = p.image || '';
      img.style.display = p.image ? '' : 'none';
      selectedBadge.classList.add('visible');

      hideResults();
      searchInput.value = '';
      searchClear.classList.remove('visible');

      document.getElementById('price').focus();
    }

    document.getElementById('selectedBadgeClear').addEventListener('click', () => {
      selectedBadge.classList.remove('visible');
      selectedProduct = null;
      document.getElementById('productCode').value = '';
      searchInput.focus();
    });

    // ── Price input (£ format) ────────────────────────────────────────────────
    const priceInput   = document.getElementById('price');
    const pricePreview = document.getElementById('pricePreview');

    priceInput.addEventListener('input', () => {
      let val = priceInput.value.replace(/[^0-9.]/g, '');
      // Only allow one decimal point
      const parts = val.split('.');
      if (parts.length > 2) val = parts[0] + '.' + parts.slice(1).join('');
      // Limit to 2 decimal places
      if (parts[1] && parts[1].length > 2) val = parts[0] + '.' + parts[1].slice(0, 2);
      priceInput.value = val;

      const pence = Math.round(parseFloat(val) * 100);
      if (!isNaN(pence) && pence > 0) {
        pricePreview.textContent = `= ${pence}p`;
      } else {
        pricePreview.textContent = '';
      }
    });

    // ── Barcode generation ────────────────────────────────────────────────────
    function padLeft(str, length) {
      return str.toString().padStart(length, '0');
    }

    function calculateCheckDigit(input) {
      let sum = 0;
      for (let i = 0; i < input.length; i++) {
        const digit  = parseInt(input[input.length - 1 - i], 10);
        const weight = (i % 2 === 0) ? 3 : 1;
        sum += digit * weight;
      }
      let checkDigit = (10 - (sum % 10)) % 10;
      if (checkDigit % 2 === 0) checkDigit = (checkDigit + 1) % 10;
      return checkDigit;
    }

    function showError(msg) {
      const el = document.getElementById('errorMessage');
      el.textContent = msg;
      el.classList.add('visible');
      setTimeout(() => el.classList.remove('visible'), 4000);
    }

    let lastGeneratedBarcode = '';

    function generateBarcode() {
      document.getElementById('errorMessage').classList.remove('visible');

      const productInput = document.getElementById('productCode').value.trim();
      const priceVal     = parseFloat(priceInput.value);
      const priceInPence = Math.round(priceVal * 100);

      if (!productInput || productInput.length < 12) {
        showError('Please enter or select a product barcode (12–13 digits)');
        return;
      }
      if (isNaN(priceInPence) || priceInPence < 10 || priceInPence > 9999) {
        showError('Price must be between £0.10 and £99.99');
        return;
      }

      let productDigits = productInput.replace(/\D/g, '');
      if (productDigits.length === 14) productDigits = productDigits.slice(0, -1);
      productDigits = padLeft(productDigits, 13);

      const paddedPrice = padLeft(priceInPence, 6);
      const baseNumber  = `91${productDigits}${paddedPrice}`;
      const checkDigit  = calculateCheckDigit(baseNumber);
      const fullBarcode = `${baseNumber}${checkDigit}`;
      lastGeneratedBarcode = fullBarcode;

      const canvas = document.getElementById('barcodeCanvas');
      canvas.width  = 600;
      canvas.height = 150;

      JsBarcode(canvas, fullBarcode, {
        format:       'CODE128',
        displayValue: true,
        fontSize:     16,
        width:        2,
        height:       100,
        margin:       10,
      });

      // Show product info above barcode
      const labelName  = document.getElementById('barcodeLabelName');
      const labelPrice = document.getElementById('barcodeLabelPrice');
      const prodName   = selectedProduct ? selectedProduct.name : 'Manual entry';
      labelName.textContent  = prodName;
      labelPrice.textContent = `Custom price: £${priceVal.toFixed(2)}`;

      // Copy digits
      document.getElementById('barcodeDigitsText').textContent = fullBarcode;

      // Download link
      const link = document.getElementById('downloadLink');
      link.href     = canvas.toDataURL('image/png').replace('image/png', 'image/octet-stream');
      link.download = `sainsbury-${productDigits}-${priceInPence}p.png`;

      // Show share button if supported
      if (navigator.share) {
        document.getElementById('shareBtn').style.display = 'flex';
      }

      const output = document.getElementById('barcodeOutput');
      output.classList.add('visible');
      output.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      // Add to history
      addToHistory({
        name: prodName,
        ean: productInput,
        pricePounds: priceVal.toFixed(2),
        pricePence: priceInPence,
        barcode: fullBarcode,
      });
    }

    // ── Copy barcode digits ──────────────────────────────────────────────────
    document.getElementById('copyBarcode').addEventListener('click', () => {
      if (!lastGeneratedBarcode) return;
      navigator.clipboard.writeText(lastGeneratedBarcode).then(() => {
        const el = document.getElementById('copyBarcode');
        el.classList.add('copied');
        const digits = document.getElementById('barcodeDigitsText');
        const original = digits.textContent;
        digits.textContent = 'Copied!';
        setTimeout(() => {
          el.classList.remove('copied');
          digits.textContent = original;
        }, 1500);
      });
    });

    // ── Share ────────────────────────────────────────────────────────────────
    document.getElementById('shareBtn').addEventListener('click', async () => {
      const canvas = document.getElementById('barcodeCanvas');
      try {
        const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
        const file = new File([blob], 'sainsbury-barcode.png', { type: 'image/png' });
        await navigator.share({ files: [file], title: 'Sainsbury\'s Barcode' });
      } catch (e) {
        // User cancelled or not supported
      }
    });

    // ── History ──────────────────────────────────────────────────────────────
    let history = JSON.parse(localStorage.getItem('sains_history') || '[]');
    const historyList     = document.getElementById('historyList');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');

    function addToHistory(item) {
      history = history.filter(h => h.barcode !== item.barcode);
      history.unshift({
        ...item,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      });
      if (history.length > 20) history.pop();
      localStorage.setItem('sains_history', JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      if (history.length === 0) {
        historyList.innerHTML = '<div class="empty-history">No barcodes generated yet</div>';
        return;
      }
      historyList.innerHTML = history.map((h, i) => `
        <div class="history-item" data-index="${i}">
          <span class="history-item-name">${esc(h.name)}</span>
          <span class="history-item-price">£${h.pricePounds}</span>
          <span class="history-item-time">${h.time}</span>
          <button class="history-item-delete" data-index="${i}" title="Remove">×</button>
        </div>
      `).join('');

      historyList.querySelectorAll('.history-item').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.classList.contains('history-item-delete')) return;
          const h = history[el.dataset.index];
          document.getElementById('productCode').value = h.ean;
          priceInput.value = h.pricePounds;
          priceInput.dispatchEvent(new Event('input'));
          selectedProduct = { name: h.name };
          generateBarcode();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });

      historyList.querySelectorAll('.history-item-delete').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          history.splice(parseInt(btn.dataset.index), 1);
          localStorage.setItem('sains_history', JSON.stringify(history));
          renderHistory();
        });
      });
    }

    clearHistoryBtn.addEventListener('click', () => {
      history = [];
      localStorage.removeItem('sains_history');
      renderHistory();
    });

    renderHistory();

    // Enter key shortcuts
    priceInput.addEventListener('keypress', e => {
      if (e.key === 'Enter') generateBarcode();
    });
    document.getElementById('productCode').addEventListener('keypress', e => {
      if (e.key === 'Enter') priceInput.focus();
    });

    // ── Escape helper ────────────────────────────────────────────────────────
    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batch Barcode Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0a0f;
      --bg-card: #12121a;
      --bg-input: #1a1a26;
      --border: #2a2a3a;
      --text-primary: #e8e8f0;
      --text-secondary: #8888a0;
      --accent: #6c5ce7;
      --accent-hover: #7d6ff0;
      --danger: #ff6b6b;
      --radius: 12px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      padding: 24px;
    }

    .no-print {
      max-width: 800px;
      margin: 0 auto;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: color 0.2s;
    }

    .back-link:hover { color: var(--accent); }

    .title {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #e8e8f0 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 24px;
    }

    .input-row {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
    }

    .input-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      color: var(--text-primary);
      font-family: 'Inter', monospace;
      font-size: 16px;
      font-weight: 600;
      outline: none;
      transition: all 0.25s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.1);
    }

    .btn-generate {
      width: 100%;
      padding: 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.25s ease;
    }

    .btn-generate:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(108, 92, 231, 0.3);
    }

    .btn-generate:disabled {
      background: var(--border);
      color: var(--text-muted);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    
    .btn-print {
      width: 100%;
      padding: 14px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.25s ease;
    }
    
    .btn-print:hover {
        background: rgba(255, 255, 255, 0.15);
    }

    /* Print Grid */
    .print-grid {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 40px;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
    }

    .print-grid.visible {
      display: grid;
    }

    .print-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      border: 1px dashed #ccc;
    }

    .print-item svg {
      width: 100%;
      height: 80px;
    }

    .print-text {
      font-family: monospace;
      color: #000;
      font-weight: 700;
      letter-spacing: 2px;
      margin-top: 8px;
    }

    @media print {
      body {
        background: #fff;
        padding: 0;
      }
      .no-print {
        display: none !important;
      }
      .print-grid.visible {
        display: grid !important;
        padding: 0;
        margin: 0;
        gap: 10px;
        box-shadow: none;
        border: none;
      }
      .print-item {
        border: 1px solid #ddd;
        break-inside: avoid;
      }
    }
  </style>
</head>
<body>

  <div class="no-print">
    <div class="header-bar">
      <a href="generators.html" class="back-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Back
      </a>
      <h1 class="title">Batch Print</h1>
    </div>

    <div class="card">
      <!-- Live Format Preview -->
      <div class="format-info" style="background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 20px;">
        <div style="font-size: 13px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px;">Live Preview</div>
        <div id="livePreview" style="font-family: 'Inter', monospace; font-size: 22px; font-weight: 700; letter-spacing: 3px; color: var(--text-primary);"></div>
        <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; font-size: 12px; color: var(--text-secondary);">
          <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--accent);vertical-align:middle;margin-right:4px;"></span> Prefix</span>
          <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#f39c12;vertical-align:middle;margin-right:4px;"></span> Issuer Code</span>
          <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#2ecc71;vertical-align:middle;margin-right:4px;"></span> Product Code</span>
          <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#e74c3c;vertical-align:middle;margin-right:4px;"></span> Value</span>
          <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#888;vertical-align:middle;margin-right:4px;"></span> Check Digit (auto)</span>
        </div>
      </div>

      <!-- Barcode Segment Inputs -->
      <div class="input-row" style="flex-wrap: wrap;">
        <div class="input-group" style="min-width: 100px; flex: 0.7;">
          <label style="color: var(--accent);">Prefix <span style="opacity: 0.5; font-size: 11px;">(2 digits)</span></label>
          <input type="text" id="prefixInput" placeholder="Random" maxlength="2" value="99">
        </div>
        <div class="input-group" style="min-width: 120px; flex: 1;">
          <label style="color: #f39c12;">Issuer Code <span style="opacity: 0.5; font-size: 11px;">(4 digits)</span></label>
          <input type="text" id="issuerInput" placeholder="Random" maxlength="4">
        </div>
        <div class="input-group" style="min-width: 110px; flex: 0.8;">
          <label style="color: #2ecc71;">Product Code <span style="opacity: 0.5; font-size: 11px;">(3 digits)</span></label>
          <input type="text" id="productInput" placeholder="Random" maxlength="3">
        </div>
        <div class="input-group" style="min-width: 110px; flex: 0.8;">
          <label style="color: #e74c3c;">Value <span style="opacity: 0.5; font-size: 11px;">(3 digits)</span></label>
          <input type="text" id="valueInput" placeholder="Random" maxlength="3" value="500">
        </div>
      </div>


      <!-- Quantity + Generate -->
      <div class="input-row">
        <div class="input-group">
          <label>Quantity</label>
          <input type="number" id="qtyInput" placeholder="10" min="1" max="100" value="10">
        </div>
      </div>
      <button class="btn-generate" id="generateBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        Generate Batch
      </button>
    </div>
    
    <div id="printControls" style="display: none; margin-bottom: 20px;">
        <button class="btn-print" onclick="window.print()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 6 2 18 2 18 9"></polyline>
              <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
              <rect x="6" y="14" width="12" height="8"></rect>
            </svg>
            Print Sheet (A4 Layout)
        </button>
    </div>
  </div>

  <div class="print-grid" id="printGrid">
    <!-- Items generated here -->
  </div>

  <script>
    const prefixInput = document.getElementById('prefixInput');
    const issuerInput = document.getElementById('issuerInput');
    const productInput = document.getElementById('productInput');
    const valueInput = document.getElementById('valueInput');

    const qtyInput = document.getElementById('qtyInput');
    const generateBtn = document.getElementById('generateBtn');
    const printGrid = document.getElementById('printGrid');
    const printControls = document.getElementById('printControls');
    const livePreview = document.getElementById('livePreview');

    function calculateCheckDigit(digits12) {
      let sum = 0;
      for (let i = 0; i < 12; i++) {
        const d = parseInt(digits12[i], 10);
        sum += (i % 2 === 0) ? d : d * 3;
      }
      const remainder = sum % 10;
      return remainder === 0 ? 0 : 10 - remainder;
    }

    function randomDigits(length) {
      let result = '';
      for (let i = 0; i < length; i++) {
        result += Math.floor(Math.random() * 10).toString();
      }
      return result;
    }

    // Enforce digits-only on segment inputs
    [prefixInput, issuerInput, productInput, valueInput].forEach(input => {
      input.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/\D/g, '').slice(0, parseInt(e.target.maxLength));
        updateLivePreview();
      });
    });

    function resolveSegment(input, requiredLength) {
      const val = input.value.trim();
      if (val.length === requiredLength) return val;
      if (val.length === 0) return randomDigits(requiredLength);
      // Partial input: pad with zeros on the right
      return val.padEnd(requiredLength, '0').slice(0, requiredLength);
    }

    function generateBarcode() {
      const prefix = resolveSegment(prefixInput, 2);
      const issuer = resolveSegment(issuerInput, 4);
      const product = resolveSegment(productInput, 3);
      const value = resolveSegment(valueInput, 3);
      const base12 = prefix + issuer + product + value;
      const checkDigit = calculateCheckDigit(base12);
      return base12 + String(checkDigit);
    }

    function updateLivePreview() {
      const pVal = prefixInput.value.trim() || '??';
      const iVal = issuerInput.value.trim() || 'XXXX';
      const prVal = productInput.value.trim() || 'NNN';
      const vVal = valueInput.value.trim() || 'VVV';

      // Pad display segments for visual alignment
      const pDisp = pVal.padEnd(2, '?').slice(0, 2);
      const iDisp = iVal.padEnd(4, 'X').slice(0, 4);
      const prDisp = prVal.padEnd(3, 'N').slice(0, 3);
      const vDisp = vVal.padEnd(3, 'V').slice(0, 3);

      // Try to compute a real check digit if all segments are complete digits
      const full = pDisp + iDisp + prDisp + vDisp;
      const allDigits = /^\d{12}$/.test(full);
      const cDisp = allDigits ? String(calculateCheckDigit(full)) : 'C';

      livePreview.innerHTML =
        `<span style="color: var(--accent);">${pDisp}</span>` +
        `<span style="color: #f39c12;">${iDisp}</span>` +
        `<span style="color: #2ecc71;">${prDisp}</span>` +
        `<span style="color: #e74c3c;">${vDisp}</span>` +
        `<span style="color: #888;">${cDisp}</span>`;
    }

    function updateGenerateButton() {
      const qty = parseInt(qtyInput.value, 10);
      const qtyOk = !isNaN(qty) && qty >= 1 && qty <= 100;
      generateBtn.disabled = !qtyOk;
    }

    qtyInput.addEventListener('input', updateGenerateButton);

    generateBtn.addEventListener('click', () => {
      if (typeof JsBarcode === 'undefined') {
        alert('Barcode library failed to load. Check your internet connection and refresh the page.');
        return;
      }

      printGrid.innerHTML = '';
      printGrid.classList.remove('visible');
      printControls.style.display = 'none';

      const qty = parseInt(qtyInput.value, 10);
      
      for (let i = 0; i < qty; i++) {
          const fullCode = generateBarcode();
          
          const item = document.createElement('div');
          item.className = 'print-item';
          item.innerHTML = `
            <svg id="batch-svg-${i}"></svg>
            <div class="print-text">${fullCode}</div>
          `;
          printGrid.appendChild(item);

          try {
            JsBarcode('#batch-svg-' + i, fullCode, {
              format: 'EAN13',
              displayValue: false,
              margin: 0,
              background: '#ffffff',
              lineColor: '#000000',
              height: 80,
              width: 2
            });
          } catch (err) {
            console.error('Barcode generation failed for', fullCode, err);
          }
      }
      
      printGrid.classList.add('visible');
      printControls.style.display = 'block';
      printGrid.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    // Initialise
    updateGenerateButton();
    updateLivePreview();
  </script>
</body>
</html>
